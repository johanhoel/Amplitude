services:
  # DanteStreamer: AirPlay -> Dante (Virgil engine)
  dantestreamer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dantestreamer
    hostname: dantestreamer
    # Required for Dante: PTP and multicast audio need the host's network.
    # Published ports don't apply in host mode, so none are listed.
    network_mode: host

    # Capabilities needed for Dante (PTP)
    cap_add:
      - NET_RAW
      - SYS_ADMIN
      - SYS_NICE    # For real-time priority
      - NET_ADMIN
      - IPC_LOCK    # lock_memory = true in the Virgil config

    ulimits:
      rtprio: 99
      memlock: -1

    volumes:
      # Configuration templates (read-only)
      - ./config/dantestreamer.conf:/app/virgil.conf.default:ro
      - ./config/shairport-sync.conf:/app/shairport-sync.conf:ro
      - ./config/snapserver.conf:/app/snapserver.conf:ro
      - ./config/asound.conf:/etc/asound.conf:ro

      # Live Virgil config (read-write: Virgil saves renames and Stop/Start here)
      - ./data:/app/data

      # Logs (read-write)
      - ./logs:/var/log/dantestreamer

      # Output (if recording to file)
      - ./output:/app/output

    environment:
      # Names (set them in .env; see .env.example)
      - DEVICE_NAME=${DEVICE_NAME:-DanteStreamer}
      - AIRPLAY_NAME=${AIRPLAY_NAME:-}
      - TX_CHANNEL_NAMES=${TX_CHANNEL_NAMES:-}
      - RX_CHANNEL_NAMES=${RX_CHANNEL_NAMES:-}

      # Logging
      - DANTE_LOG_LEVEL=info

      # Feature toggles
      - AIRPLAY_ENABLED=true
      # Snapserver is not a Google Cast receiver; off until one is added
      - CHROMECAST_ENABLED=false

    # Restart policy
    restart: unless-stopped

    # Health checks
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8480/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
