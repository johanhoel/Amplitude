// Shairport-sync configuration for DanteStreamer
// AirPlay receiver - sends audio to ALSA/PulseAudio

general = {
  // Device name as it appears in AirPlay (e.g., Control Center)
  name = "DanteStreamer";

  // Log verbosity: "emerg", "alert", "crit", "err", "warning", "notice", "info", "debug"
  log_level = "notice";

  // Run as daemon
  daemon_dont_exit = "yes";
};

// Audio output to the Virgil (Dante) ALSA device
alsa = {
  output_device = "virgil";

  // Buffer settings
  buffer_length = 4410;  // ~100ms at 44.1kHz

  // Disable mixer (we'll handle mixing with ALSA)
  mixer_control_name = "";

  // Disable built-in volume control
  disable_synchronization = "no";
};

// Network settings
sessioncontrol = {
  // Session timeout
  timeout = 360;

  // Allow interruption by other sources
  allow_interruption = "yes";
};

// Metadata (optional)
metadata = {
  // Send metadata to file
  enabled = "no";
};

// Latency (tuning)
latencies = {
  // Latency in milliseconds
  audio_backend_latency_offset = 0;
  audio_backend_buffer_adjustment_threshold = 0.02;
};
