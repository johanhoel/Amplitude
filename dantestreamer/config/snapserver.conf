# Snapserver configuration for DanteStreamer
# Google Cast receiver - sends audio to ALSA/PulseAudio

[server]
# Server port
port = 1704

# Listen on all interfaces
listen = 0.0.0.0

# Logging
logfilter = info
syslog = false

[http]
# HTTP control port
port = 1780
# docroot = /usr/share/snapserver/server/public

[tcp]
port = 1705

[udp]
port = 1706
sendToHost = localhost

# Audio source: ALSA (from PulseAudio)
[source_alsa]
name = GoogleCast
params = default?buffer_time=20000
format = pcm?rate=48000&bits=16&channels=2

# Audio sources are played in sequence or mixed
# Default: ALSA passthrough from Google Cast devices
