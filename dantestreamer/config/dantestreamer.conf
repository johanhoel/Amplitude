# DanteStreamer configuration (Virgil daemon format)
# Full reference: config/virgil.conf.example in
# https://github.com/Audbol/virgil-virtual-soundcard
#
# This is the starting template. On first start it is copied to
# data/virgil.conf, which Virgil then owns: edit that file (or use the
# Virgil panel / Dante Controller) and restart. Device and channel names
# come from .env instead; see .env.example.

[device]
# Set from DEVICE_NAME in .env on every start
name = DanteStreamer
# Network interface on the Dante network (name or IPv4 address).
# Empty = first active non-loopback interface.
interface =
sample_rate = 48000
tx_channels = 8
rx_channels = 8
# Receive buffer depth and transmit lead (microseconds)
latency_us = 4000
tx_latency_us = 4000
rt_priority = 80
lock_memory = true
# ptp = follow the Dante clock leader (PTPv1, required for Dante)
clock = ptp
ports = auto
# Web panel / REST API (/api/status, /api/diagnostics, ...)
control_port = 8480
# true = reachable from other machines; needs remote_password
remote_access = false
#remote_password = choose-a-password
enabled = true

[channel_names]
# tx = DanteStreamer -> network, rx = network -> DanteStreamer.
# Set from TX_CHANNEL_NAMES / RX_CHANNEL_NAMES in .env, or rename in
# Dante Controller (saved here). Unnamed channels are TX n / RX n.

[ptp]
subdomain = _DFLT
# Become the clock leader when no Dante device provides one.
# Only ONE device on the network should do this.
master_capable = false
