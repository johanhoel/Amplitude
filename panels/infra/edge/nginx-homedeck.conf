# Home Deck (CT 106 buttons, .52) for paired phones: the Android app and phones' home-screen web app.
# Router forwards WAN 8126 here; at home split DNS sends home.example.net here too.
# Every request is checked with Home Deck first (auth_request /api/pair/check): only a paired device's key
# (cookie hd_device or Authorization: Bearer) gets through. Home Deck checks again itself (requests from .40
# without a key get 401), so a mistake here cannot open it. Pair / remove devices on http://192.168.1.52/devices.

upstream homedeck { server 192.168.1.52:80; keepalive 8; }

limit_req_zone $binary_remote_addr zone=hd_all:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=hd_pair:10m rate=10r/m;

server {
    listen 8126 ssl;
    listen [::]:8126 ssl;
    http2 on;
    server_name home.example.net;
    access_log /var/log/nginx/homedeck.access.log;
    access_log syslog:server=192.168.1.234:514,tag=nginx_access,severity=info,nohostname monitor_json;  # -> monitor/Loki

    ssl_certificate /etc/letsencrypt/live/home.example.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/home.example.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    error_page 497 =301 https://$host:8126$request_uri;
    client_max_body_size 16m;
    limit_req zone=hd_all burst=80 nodelay;
    limit_req_status 429;

    # common proxy settings (the visitor's real address goes in X-Real-IP; anything the visitor sent is replaced)
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";

    location = /_hd_check {
        internal;
        proxy_pass http://homedeck/api/pair/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # open without a key: the pairing page and its API (the claim itself only works from the home network)
    location ~ ^/(pair|pair\.html|api/pair/check|favicon\.ico|familyinfo-icon\.png)$ {
        proxy_pass http://homedeck;
    }
    location = /api/pair/claim {
        limit_req zone=hd_pair burst=5 nodelay;
        proxy_pass http://homedeck;
    }

    # everything else: paired devices only
    location / {
        auth_request /_hd_check;
        error_page 401 = @unpaired;
        proxy_pass http://homedeck;
        proxy_buffering off;              # live updates (event streams)
        proxy_read_timeout 3600s;
    }
    location @unpaired {
        if ($uri ~ ^/api/) { return 401 '{"error":"not paired"}'; }
        return 302 /pair;
    }
}
