<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#12151d">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Admin PIN</title>
<style>
/* Shown when an admin page is opened without the admin PIN (the server redirects here with ?next=). After the PIN it goes on. */
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
.back { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 18px); transform: translateX(-50%); z-index: 130; color: var(--mute); font-size: 14px; }
.back a { color: #7dd3fc; }
</style><link rel="stylesheet" href="/wall.css">
<script src="/addons.js"></script>
</head><body>
<div class="back">This page is for the home admin · <a href="/start">Back to Start</a></div>
<script src="/pin.js"></script>
<script>
const next = new URLSearchParams(location.search).get('next') || '/admin';
const safe = /^\/(?!\/)[\w./?=&%-]*$/.test(next) ? next : '/admin';          // only paths on this server
deckPin.open({ onOk: () => location.replace(safe) });
addEventListener('deckpin-cancel', () => location.replace('/start'));
</script>
</body></html>
