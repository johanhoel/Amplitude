<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12151d">
<title>Home</title>
<style>
/* Home panel: the things you reach for every day, as objects instead of tiles - a dial for the speakers,
   bulbs per room, a slider for the door. Every tap updates the screen first, then tells the server. */

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font);
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
body { background:
  radial-gradient(55% 45% at 85% 0%, rgba(255,140,60,.16), transparent 70%),
  radial-gradient(60% 55% at 0% 100%, rgba(56,189,248,.22), transparent 70%), var(--bg); background-attachment: fixed; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
.cap { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); font-weight: 650; }

.app { display: grid; gap: 26px 44px; padding: calc(env(safe-area-inset-top) + 20px) 30px calc(env(safe-area-inset-bottom) + 30px);
  grid-template-columns: minmax(290px, 340px) minmax(0, 1fr); grid-template-areas: "left mid" "left rooms"; align-items: start; max-width: 1700px; margin: 0 auto; }
@media (max-width: 760px) { .app { grid-template-columns: 1fr; grid-template-areas: "left" "mid" "rooms"; padding: 16px 16px 30px; } }
.left { grid-area: left; display: grid; gap: 24px; align-content: start; }
/* speakers + music side by side, rooms flow underneath in as many columns as fit */
.mid { grid-area: mid; display: flex; flex-wrap: wrap; gap: 18px 36px; align-items: center; }
.mid .ctrls { display: grid; gap: 16px; flex: 1 1 300px; min-width: 0; }
.rooms { grid-area: rooms; columns: 3 240px; column-gap: 34px; }
.rooms .room { break-inside: avoid; margin-bottom: 24px; }

nav { display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid var(--line); justify-self: start; }
nav a { color: var(--mute); text-decoration: none; padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; }
nav a.on { background: rgba(255,255,255,.12); color: var(--ink); }

/* clock + weather + people */
.clock { font-size: clamp(64px, 8vw, 104px); font-weight: 150; letter-spacing: -.05em; line-height: .9; }
.date { color: var(--mute); font-size: 15px; margin-top: 8px; text-transform: capitalize; }
.wx { display: flex; align-items: baseline; gap: 12px; margin-top: 14px; }
.wx b { font-size: 34px; font-weight: 250; } .wx span { color: var(--mute); font-size: 14px; text-transform: capitalize; }
.temps { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; font-size: 13px; color: var(--mute); }
.temps b { color: var(--ink); font-weight: 550; margin-left: 4px; }
.people { display: flex; gap: 14px; flex-wrap: wrap; }
.person { display: grid; justify-items: center; gap: 6px; font-size: 12px; color: var(--mute); }
.avatar { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; font-weight: 600;
  background: linear-gradient(135deg, #2a2340, #17141f); border: 2px solid var(--faint); color: var(--mute); }
.person.home .avatar { border-color: var(--ok); color: var(--ink); }

/* door: slide to lock */
.door { position: relative; height: 64px; border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid var(--line); overflow: hidden; touch-action: none; }
.door .lbl { position: absolute; inset: 0; display: grid; place-items: center; font-size: 15px; color: var(--mute); font-weight: 550; pointer-events: none; }
.door .knob { position: absolute; top: 5px; left: 5px; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center;
  background: var(--warn); color: #241a00; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
.door .knob svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
.door.locked { border-color: rgba(52,211,153,.35); background: rgba(52,211,153,.07); }
.door.locked .knob { left: calc(100% - 59px); background: var(--ok); color: #03200f; }
.door.locked .lbl { color: var(--ok); }
.door .knob.anim { transition: left .2s cubic-bezier(.2,.8,.2,1); }

/* camera */
.cam { position: relative; border-radius: 26px; overflow: hidden; background: #000; aspect-ratio: 16/9; }
.cam img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cam .tag { position: absolute; left: 14px; top: 12px; padding: 5px 11px; border-radius: 999px; background: rgba(0,0,0,.55); font-size: 12.5px; font-weight: 600; }
.cam .arr { position: absolute; top: 50%; width: 40px; height: 40px; margin-top: -20px; border-radius: 50%; background: rgba(0,0,0,.45); font-size: 22px; line-height: 1; }
.cam .arr.l { left: 10px; } .cam .arr.r { right: 10px; }
.chips { display: flex; gap: 10px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 10px 15px; border-radius: 999px; background: rgba(255,255,255,.05);
  border: 1px solid var(--line); font-size: 13.5px; font-weight: 550; transition: transform .08s, background .12s; }
.chip:active { transform: scale(.95); }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.chip.on { background: rgba(56,189,248,.22); border-color: rgba(56,189,248,.5); } .chip.on i { background: var(--accent); }

/* volume dial */
.dial { width: min(300px, 82vw); aspect-ratio: 1; position: relative; touch-action: none; flex: none; margin: -6px 0 -18px; }
.dial svg { width: 100%; height: 100%; }
.dial .track { fill: none; stroke: rgba(255,255,255,.07); stroke-width: 16; stroke-linecap: round; }
.dial .val { fill: none; stroke: url(#vg); stroke-width: 16; stroke-linecap: round; }
.dial .thumb { fill: #fff; filter: drop-shadow(0 3px 8px rgba(0,0,0,.5)); }
.dial .face { position: absolute; inset: 22%; border-radius: 50%; display: grid; place-items: center; text-align: center;
  background: radial-gradient(circle at 50% 30%, #23202f, #121019 72%); box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 18px 40px rgba(0,0,0,.45); }
.dial .face b { font-size: 54px; font-weight: 200; letter-spacing: -.03em; display: block; line-height: 1; }
.dial .face span { font-size: 12px; color: var(--mute); letter-spacing: .14em; }
.dial.muted .val { stroke: rgba(255,255,255,.25); } .dial.muted .face b { color: var(--bad); }
.dial.off { opacity: .4; }
.spk { display: flex; gap: 14px; font-size: 12.5px; color: var(--mute); }
.spk i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: var(--faint); }
.spk i.ok { background: var(--ok); } .spk i.warn { background: var(--warn); }
.seg { display: inline-flex; padding: 4px; border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid var(--line); }
.seg button { padding: 9px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 600; color: var(--mute); }
.seg button.on { background: rgba(255,255,255,.13); color: var(--ink); }

/* now playing */
.np { display: grid; grid-template-columns: 96px 1fr; gap: 18px; align-items: center; width: 100%; max-width: 420px; margin-top: 8px; }
.vinyl { width: 96px; height: 96px; border-radius: 50%; background: #111 center/cover; box-shadow: 0 10px 30px rgba(0,0,0,.5), 0 0 0 6px rgba(255,255,255,.04); }
.vinyl.spin { animation: spin 7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.np .t { font-weight: 650; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np .a { color: var(--mute); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.ctl { display: flex; gap: 10px; margin-top: 12px; }
.ctl button { width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,.07); display: grid; place-items: center; font-size: 15px; transition: transform .08s; }
.ctl button:active { transform: scale(.9); }
.ctl button.main { width: 48px; height: 48px; background: #fff; color: #000; }

/* rooms + bulbs */
.room { display: grid; gap: 12px; }
.room header { display: flex; align-items: baseline; gap: 10px; }
.room h3 { margin: 0; font-size: 19px; font-weight: 640; letter-spacing: -.01em; }
.room header small { color: var(--mute); font-size: 13px; }
.room header button { margin-left: auto; font-size: 12.5px; color: var(--mute); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); }
.room header button[hidden] { display: none; }
.bulbs { display: flex; flex-wrap: wrap; gap: 14px 12px; }
.bulb { width: 72px; display: grid; justify-items: center; gap: 7px; font-size: 11.5px; color: var(--mute); text-align: center; line-height: 1.2; touch-action: pan-x; }
.bulb .orb { --b: 0; width: 54px; height: 54px; border-radius: 50%; position: relative; display: grid; place-items: center;
  background: rgba(255,255,255,.05); border: 1px solid var(--line); transition: background .12s, box-shadow .12s, transform .08s; }
.bulb .orb svg { width: 24px; height: 24px; fill: none; stroke: var(--mute); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.bulb.on { color: var(--ink); }
.bulb.on .orb { background: radial-gradient(circle at 50% 40%, #ffe2a8, var(--warm) 60%, #e07b1c);
  box-shadow: 0 0 calc(10px + 26px * var(--b)) rgba(255,181,71,calc(.25 + .45 * var(--b))); border-color: transparent; }
.bulb.on .orb svg { stroke: #3a2200; }
.bulb .orb:active { transform: scale(.93); }
.bulb .lvl { position: absolute; inset: -6px; pointer-events: none; transform: rotate(-90deg); }
.bulb .lvl circle { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 220; stroke-dashoffset: 220; opacity: 0; transition: opacity .15s; }
.bulb.dragging .lvl circle { opacity: 1; }
.bulb .pct { position: absolute; top: -22px; font-size: 12px; color: #fff; font-weight: 650; opacity: 0; }
.bulb.dragging .pct { opacity: 1; }

/* overlay */
#ov { position: fixed; inset: 0; z-index: 20; display: none; place-items: center; background: rgba(4,3,8,.86); padding: 20px; }
#ov.open { display: grid; }
#ov img { max-width: 100%; max-height: 86vh; border-radius: 20px; background: #000; }
#ov .x { position: absolute; top: calc(env(safe-area-inset-top) + 18px); right: 20px; width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.1); font-size: 20px; }
.hint { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 26px); transform: translate(-50%, 20px); opacity: 0; z-index: 30;
  padding: 11px 18px; border-radius: 999px; background: #1c1824; border: 1px solid var(--line); font-size: 14px; transition: opacity .15s, transform .15s; pointer-events: none; }
.hint.show { opacity: 1; transform: translate(-50%, 0); }
</style>
<link rel="stylesheet" href="/wall.css">
<link rel="stylesheet" href="/icons.css">
</head>
<body>
<div class="app">
  <section class="left">
    <nav><a href="/">Deck</a><a href="/living" class="on">Home</a><a href="/ops">Lab</a></nav>
    <div>
      <div class="clock num" id="clock">--:--</div><div class="date" id="date"></div>
      <div class="wx"><b class="num" id="out">--°</b><span id="wx"></span></div>
      <div class="temps" id="temps"></div>
    </div>
    <div><div class="cap" style="margin-bottom:12px">Who's home</div><div class="people" id="people"></div></div>
    <div><div class="cap" style="margin-bottom:12px">Front door</div>
      <div class="door" id="door"><div class="lbl" id="door-lbl">–</div><div class="knob"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0" id="shackle"/></svg></div></div></div>
    <div>
      <div class="cam" id="cam"><img id="cam-img" alt=""><span class="tag" id="cam-tag">Camera</span>
        <button class="arr l" data-step="-1" aria-label="Previous camera">‹</button><button class="arr r" data-step="1" aria-label="Next camera">›</button></div>
    </div>
    <div class="chips"><button class="chip" id="detect"><i></i>Motion alerts</button><button class="chip" id="vac"><i></i><span>Vacuum</span></button><span class="chip" id="charger" style="pointer-events:none"><i></i><span>Charger</span></span></div>
  </section>

  <section class="mid">
    <div class="dial" id="dial">
      <svg viewBox="0 0 200 200"><defs><linearGradient id="vg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#ff7ac6"/></linearGradient></defs>
        <path class="track" id="trk"/><path class="val" id="arc"/><circle class="thumb" id="thumb" r="11" style="display:none"/></svg>
      <button class="face" id="face"><div><b class="num" id="db">--</b><span id="dbl">dB · tap to mute</span></div></button>
    </div>
    <div class="ctrls">
    <div class="spk" id="spk"></div>
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      <span class="seg" id="src"><button data-s="pc">PC</button><button data-s="bt">Bluetooth</button></span>
      <button class="chip" id="power"><i></i>Speakers on</button>
    </div>
    <div class="np"><div class="vinyl" id="art"></div>
      <div style="min-width:0"><div class="cap">Now playing</div><div class="t" id="np-t">—</div><div class="a" id="np-a"></div>
        <div class="ctl"><button data-m="media_previous_track" aria-label="Previous"><i class="icon icon-prev" aria-hidden="true"></i></button><button class="main" data-m="media_play_pause" id="np-pp" aria-label="Play or pause"><i class="icon icon-play" aria-hidden="true"></i></button><button data-m="media_next_track" aria-label="Next"><i class="icon icon-next" aria-hidden="true"></i></button></div></div></div>
    </div>
  </section>

  <section class="rooms" id="rooms"></section>
</div>
<div id="ov"><img id="ov-img" alt="Live camera"><button class="x" id="ov-x" aria-label="Close">✕</button></div>
<div class="hint" id="hint"></div>

<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const BULB = '<svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>';
let H = null, G = null, cams = [], camI = 0;
const WX = { partlycloudy: 'partly cloudy', 'clear-night': 'clear night', lightning: 'thunder', 'lightning-rainy': 'thunder + rain',
  'snowy-rainy': 'sleet', windy: 'windy', 'windy-variant': 'windy + clouds', exceptional: 'extreme weather' };
const hold = {};                 // entity -> until(ms): ignore server state briefly after our own change (no flicker back)

function hint(t) { const h = $('#hint'); h.textContent = t; h.classList.add('show'); clearTimeout(h._t); h._t = setTimeout(() => h.classList.remove('show'), 1600); }
async function post(url, body) { const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || r.status); return j;
}
const doHA = (body, msg) => post('/api/home/do', body).then(() => setTimeout(loadHome, 500)).catch(e => { hint('✗ ' + e.message); loadHome(); });
function press(el, fn) { // fire on lift if the finger did not move, so scrolling past a button never presses it
  let d = null;
  el.addEventListener('pointerdown', e => { if (e.button === 0) d = { x: e.clientX, y: e.clientY }; });
  el.addEventListener('pointerup', e => { if (d && Math.hypot(e.clientX - d.x, e.clientY - d.y) < 10) fn(e); d = null; });
  el.addEventListener('pointercancel', () => d = null);
}

/* clock */
function tick() { const d = new Date();
  $('#clock').textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
  $('#date').textContent = d.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' }); }
tick(); setInterval(tick, 1000);

/* ---------- Home Assistant state ---------- */
async function loadHome() { if (document.visibilityState !== 'visible') return;
  try { H = await (await fetch('/api/home/state')).json(); } catch { return; }
  if (!H.configured || H.error) return;
  $('#out').textContent = H.outside != null ? `${Math.round(H.outside * 10) / 10}°` : '--°';
  $('#wx').textContent = WX[H.weather] || (H.weather || '').replace(/[-_]/g, ' ');
  $('#temps').innerHTML = (H.temps || []).filter(t => /office|garage internal|kontor|vardag|living|bed/i.test(t.name)).slice(0, 4)
    .map(t => `<span>${esc(t.name.replace(/ Temperature| temperature|_temp/g, '').replace(/_/g, ' '))}<b>${t.value.toFixed(1)}°</b></span>`).join('');
  $('#people').innerHTML = (H.people || []).map(p => `<div class="person ${p.home ? 'home' : ''}"><div class="avatar">${esc(p.name[0])}</div>${esc(p.name)}</div>`).join('');
  if (!(hold.door > Date.now())) setDoor(H.door.state);
  $('#detect').classList.toggle('on', !!H.detect);
  const v = H.vacuum || {}; $('#vac').classList.toggle('on', v.state === 'cleaning');
  $('#vac span').textContent = v.state === 'cleaning' ? 'Vacuum · cleaning' : v.state === 'returning' ? 'Vacuum · going home' : 'Vacuum · ' + (v.state || '–');
  $('#charger span').textContent = H.charger_w ? `Charging ${H.charger_w.toFixed(H.charger_unit === 'kW' ? 1 : 0)} ${H.charger_unit}` : 'Charger idle';
  $('#charger').classList.toggle('on', !!H.charger_w);
  const m = H.media || {};
  $('#np-t').textContent = m.title || (m.state === 'idle' ? 'Nothing playing' : '—'); $('#np-a').textContent = m.artist || '';
  $('#np-pp').firstElementChild.className = (m.state === 'playing' ? 'icon icon-pause' : 'icon icon-play'); $('#art').classList.toggle('spin', m.state === 'playing');
  const art = m.art ? `url(/api/art?k=${encodeURIComponent(m.art_key)})` : '';
  if ($('#art').style.backgroundImage !== art) $('#art').style.backgroundImage = art;
  renderRooms();
}

/* rooms: built once per room set, then patched */
function renderRooms() { const box = $('#rooms'), rooms = H.rooms || [];
  const sig = rooms.map(r => r.room + ':' + r.lights.map(l => l.id).join(',')).join('|');
  if (box.dataset.sig !== sig) { box.dataset.sig = sig;
    box.innerHTML = rooms.map(r => `<div class="room" data-room="${esc(r.room)}"><header><h3>${esc(r.room)}</h3><small></small><button hidden>All off</button></header>
      <div class="bulbs">${r.lights.map(l => `<div class="bulb" data-id="${l.id}" data-dim="${l.dim ? 1 : ''}"><div class="orb"><span class="pct num"></span>${BULB}
        <svg class="lvl" viewBox="0 0 76 76"><circle cx="38" cy="38" r="35"/></svg></div><span>${esc(l.name)}</span></div>`).join('')}</div></div>`).join('');
    $$('.bulb').forEach(bindBulb);
    $$('.room header button').forEach(b => press(b, () => { const room = b.closest('.room'); room.querySelectorAll('.bulb.on').forEach(x => { x.classList.remove('on'); hold[x.dataset.id] = Date.now() + 3000; });
      paintRoomCounts(); doHA({ do: 'room_off', entity: room.dataset.room });
    }));
  }
  rooms.forEach(r => r.lights.forEach(l => { if (hold[l.id] > Date.now()) return;
    const el = box.querySelector(`.bulb[data-id="${l.id}"]`); if (!el) return;
    el.classList.toggle('on', l.on); el.querySelector('.orb').style.setProperty('--b', l.on ? (l.bri ?? 100) / 100 : 0); el.dataset.bri = l.bri ?? '';
  }));
  paintRoomCounts();
}
function paintRoomCounts() { $$('.room').forEach(r => { const on = r.querySelectorAll('.bulb.on').length, n = r.querySelectorAll('.bulb').length;
    r.querySelector('small').textContent = on ? `${on} of ${n} on` : 'all off'; r.querySelector('header button').hidden = !on; });
}
/* bulb: tap = toggle (instantly); press and slide up/down = brightness for dimmable lights */
function bindBulb(el) { const orb = el.querySelector('.orb'), arc = el.querySelector('.lvl circle'), pctEl = el.querySelector('.pct');
  let d = null;
  orb.addEventListener('pointerdown', e => { if (e.button > 0) return;
    d = { y: e.clientY, x: e.clientX, b: +(el.dataset.bri || (el.classList.contains('on') ? 100 : 0)), drag: false, v: null };
    orb.setPointerCapture(e.pointerId);
  });
  orb.addEventListener('pointermove', e => { if (!d || !el.dataset.dim) return;
    const dy = d.y - e.clientY;
    if (!d.drag && Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(e.clientX - d.x)) { d.drag = true; el.classList.add('dragging'); }
    if (d.drag) { d.v = Math.max(1, Math.min(100, Math.round(d.b + dy / 1.6)));
      arc.style.strokeDashoffset = 220 * (1 - d.v / 100); pctEl.textContent = d.v + '%';
      el.classList.add('on'); orb.style.setProperty('--b', d.v / 100);
    }
  });
  const end = () => { if (!d) return; const id = el.dataset.id;
    hold[id] = Date.now() + 3000;
    if (d.drag && d.v) { el.dataset.bri = d.v; doHA({ do: 'bri', entity: id, value: d.v }); }
    else if (!d.drag) { const on = !el.classList.contains('on'); el.classList.toggle('on', on);
      orb.style.setProperty('--b', on ? (+el.dataset.bri || 100) / 100 : 0); navigator.vibrate && navigator.vibrate(12);
      doHA({ do: 'toggle', entity: id });
    }
    el.classList.remove('dragging'); d = null; paintRoomCounts();
  };
  orb.addEventListener('pointerup', end);
  orb.addEventListener('pointercancel', () => { el.classList.remove('dragging'); d = null; });
}

/* door: drag the knob to the right end to lock. Unlocking stays in the lock's own app. */
function setDoor(state) { const d = $('#door'); d.classList.toggle('locked', state === 'locked'); d.querySelector('.knob').style.left = '';
  $('#door-lbl').textContent = state === 'locked' ? 'Locked' : state === 'unlocked' ? 'Slide to lock  ›' : (state || '–');
  $('#shackle').setAttribute('d', state === 'locked' ? 'M8 11V8a4 4 0 0 1 8 0v3' : 'M8 11V8a4 4 0 0 1 8 0');
}
(() => { const door = $('#door'), knob = door.querySelector('.knob'); let d = null;
  knob.addEventListener('pointerdown', e => { if (door.classList.contains('locked')) return hint('Unlock from the lock app'); d = { x: e.clientX }; knob.setPointerCapture(e.pointerId); knob.classList.remove('anim'); });
  knob.addEventListener('pointermove', e => { if (!d) return; const max = door.clientWidth - 64;
    knob.style.left = 5 + Math.max(0, Math.min(max, e.clientX - d.x)) + 'px'; });
  knob.addEventListener('pointerup', e => { if (!d) return; const max = door.clientWidth - 64, x = e.clientX - d.x; d = null; knob.classList.add('anim');
    if (x > max * .8) { hold.door = Date.now() + 8000; setDoor('locked'); $('#door-lbl').textContent = 'Locking…'; navigator.vibrate && navigator.vibrate(30); doHA({ do: 'lock' }); }
    else knob.style.left = '';
  });
})();

press($('#detect'), () => { $('#detect').classList.toggle('on'); doHA({ do: 'detect' }); });
press($('#vac'), () => { const cleaning = $('#vac').classList.contains('on');
  $('#vac').classList.toggle('on', !cleaning); $('#vac span').textContent = cleaning ? 'Vacuum · going home' : 'Vacuum · starting';
  doHA({ do: 'vacuum', value: cleaning ? 'return_to_base' : 'start' }); });
$$('[data-m]').forEach(b => press(b, () => { if (b.dataset.m === 'media_play_pause') { const p = $('#np-pp').firstElementChild.classList.contains('icon-pause');
    $('#np-pp').firstElementChild.className = (p ? 'icon icon-play' : 'icon icon-pause'); $('#art').classList.toggle('spin', !p); }
  doHA({ do: 'media', value: b.dataset.m });
}));

/* ---------- speakers: the dial ---------- */
const MIN = -60, MAX = 0, A0 = 225, SWEEP = 270, R = 84;          // clockwise from 12 o'clock: 7:30 round to 4:30
const pt = a => { const r = (a - 90) * Math.PI / 180; return [100 + R * Math.cos(r), 100 + R * Math.sin(r)]; };
const arcPath = (a1, a2) => { const [x1, y1] = pt(a1), [x2, y2] = pt(a2); return `M${x1} ${y1} A${R} ${R} 0 ${a2 - a1 > 180 ? 1 : 0} 1 ${x2} ${y2}`; };
$('#trk').setAttribute('d', arcPath(A0, A0 + SWEEP));
let vol = null, volBusy = 0, muted = false;
function paintDial(v) { vol = v; const f = (v - MIN) / (MAX - MIN), a = A0 + SWEEP * Math.max(0.0001, f);
  $('#arc').setAttribute('d', arcPath(A0, a)); const [x, y] = pt(a); $('#thumb').setAttribute('cx', x); $('#thumb').setAttribute('cy', y); $('#thumb').style.display = '';
  $('#db').textContent = Math.round(v);
}
(() => { const dial = $('#dial'); let dragging = false, last = 0;
  const angleToVal = e => { const r = dial.getBoundingClientRect(); let a = Math.atan2(e.clientY - r.top - r.height / 2, e.clientX - r.left - r.width / 2) * 180 / Math.PI + 90;
    a = (a + 360) % 360; let rel = a - A0; if (rel < 0) rel += 360; if (rel > SWEEP) rel = rel > SWEEP + (360 - SWEEP) / 2 ? 0 : SWEEP;
    return Math.round(MIN + (MAX - MIN) * rel / SWEEP); };
  dial.addEventListener('pointerdown', e => { if (e.target.closest('#face') || dial.classList.contains('off')) return;
    const r = dial.getBoundingClientRect(), dx = e.clientX - r.left - r.width / 2, dy = e.clientY - r.top - r.height / 2;
    if (Math.hypot(dx, dy) < r.width * .28) return;                       // only the ring turns the dial
    dragging = true; dial.setPointerCapture(e.pointerId); volBusy = Date.now(); paintDial(angleToVal(e));
  });
  dial.addEventListener('pointermove', e => { if (!dragging) return; volBusy = Date.now(); paintDial(angleToVal(e));
    if (Date.now() - last > 200) { last = Date.now(); send(); } });            // speakers follow while you turn
  dial.addEventListener('pointerup', () => { if (dragging) { dragging = false; send(); } });
  const send = () => post('/api/genelec', { action: 'volume', value: vol }).catch(e => hint('✗ Speakers: ' + e.message));
})();
press($('#face'), () => { muted = !muted; $('#dial').classList.toggle('muted', muted); $('#dbl').textContent = muted ? 'muted · tap to unmute' : 'dB · tap to mute';
  post('/api/genelec', { action: 'mute', value: muted }).catch(e => hint('✗ ' + e.message)); });
press($('#power'), () => { const on = !$('#power').classList.contains('on'); $('#power').classList.toggle('on', on);
  post('/api/genelec', { action: 'power', value: on }).catch(e => hint('✗ ' + e.message)); });
press($('#src'), e => { const b = e.target.closest('[data-s]'); if (!b) return; $$('#src button').forEach(x => x.classList.toggle('on', x === b)); hint('Switching source…');
  post('/api/dante/source', { source: b.dataset.s }).then(() => hint('Source: ' + b.textContent)).catch(err => hint('✗ Dante: ' + err.message)); });
async function loadStatus() { if (document.visibilityState !== 'visible') return;
  let s; try { s = await (await fetch('/api/status')).json(); } catch { return; }
  G = s.genelec || {};
  $('#dial').classList.toggle('off', !G.configured || G.level == null);
  if (G.level != null && Date.now() - volBusy > 4000) paintDial(Math.max(MIN, G.level));
  if (Date.now() - volBusy > 4000) { muted = !!G.mute; $('#dial').classList.toggle('muted', muted); $('#dbl').textContent = muted ? 'muted · tap to unmute' : 'dB · tap to mute'; }
  $('#power').classList.toggle('on', G.power === 'ACTIVE');
  $('#spk').innerHTML = (G.speakers || []).map((x, i) => `<span><i class="${!x.ok ? '' : x.power === 'ACTIVE' ? 'ok' : 'warn'}"></i>${['4430 L', '4430 R', '3440 sub'][i]}</span>`).join('');
  const d = s.dante || {}; if (d.ok) $$('#src button').forEach(x => x.classList.toggle('on', x.dataset.s === d.source));
}

/* ---------- camera ---------- */
let camBusy = false;
function snap() { const c = cams[camI]; if (!c || camBusy || document.visibilityState !== 'visible' || $('#ov').classList.contains('open')) return;
  camBusy = true; const img = new Image();
  img.onload = () => { $('#cam-img').src = img.src; camBusy = false; }; img.onerror = () => { camBusy = false; };
  img.src = `/api/cam/${c.entity}/snap?w=${Math.min(1280, Math.round($('#cam').clientWidth * (devicePixelRatio || 1)))}&t=${Date.now()}`;
}
function setCamI(i) { camI = (i + cams.length) % cams.length; $('#cam-tag').textContent = cams[camI].name; camBusy = false; snap(); }
(() => { const cam = $('#cam'); let d = null;
  cam.addEventListener('pointerdown', e => { d = { x: e.clientX, y: e.clientY }; });
  cam.addEventListener('pointerup', e => { if (!d) return; const moved = Math.hypot(e.clientX - d.x, e.clientY - d.y) > 12, dx = e.clientX - d.x; d = null;
    const step = e.target.closest('[data-step]');
    if (step) return setCamI(camI + +step.dataset.step);
    if (moved && Math.abs(dx) > 40) return setCamI(camI + (dx < 0 ? 1 : -1));       // swipe = next camera
    if (!moved && cams[camI]) { $('#ov-img').src = `/api/cam/${cams[camI].entity}/stream?t=${Date.now()}`; $('#ov').classList.add('open'); }
  });
})();
const closeOv = () => { $('#ov').classList.remove('open'); $('#ov-img').src = ''; snap(); };
press($('#ov-x'), closeOv); press($('#ov'), e => { if (e.target.id === 'ov') closeOv(); });
fetch('/api/cams').then(r => r.json()).then(c => { cams = Array.isArray(c) ? c : [];
  if (!cams.length) return $('#cam').parentElement.remove();
  fetch('/api/settings').then(r => r.json()).then(s => { const i = cams.findIndex(x => x.entity === s.camera); setCamI(i >= 0 ? i : 0); }).catch(() => setCamI(0));
}).catch(() => {});

loadHome(); loadStatus();
setInterval(loadHome, 2500); setInterval(loadStatus, 4000); setInterval(snap, 2500);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { loadHome(); loadStatus(); snap(); } });
</script>
<script src="/panels.js"></script>
<script src="/start.js" defer></script>
<script src="/cam.js" defer></script>
