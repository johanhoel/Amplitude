<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#12151d">
<meta name="apple-mobile-web-app-title" content="Family info"><meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="/familyinfo-icon.png">
<title>Family info</title>
<style>
/* Family info: when the next bus leaves from the stop near home, the weather, and which buses are arriving.
   Made for iPhone/iPad (home-screen app): safe areas, no fixed backgrounds (iOS Safari repaints them on scroll),
   refreshes when the app comes back from the background. No links to other panels on purpose (family page).
   Data: /api/bus (Vasttrafik's public departure board feed, 20 s) and /api/weather (met.no via Home Assistant), all at least once a minute. */
/* page-local only; the palette comes from wall.css */
:root { --rain: #60a5fa; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--bg); }
html, body { margin: 0; min-height: 100%; color: var(--ink); font-family: var(--font); -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; -webkit-touch-callout: none; overscroll-behavior-y: none; }
body { background: var(--bg); }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(70% 50% at 50% -10%, rgba(34,211,238,.20), transparent 70%), radial-gradient(60% 40% at 100% 100%, rgba(56,189,248,.14), transparent 70%); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1400px; margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 22px) calc(var(--sr) + 28px) calc(env(safe-area-inset-bottom) + 40px) calc(var(--sl) + 28px); }
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
h1 { margin: 0; font-size: 40px; font-weight: 750; letter-spacing: -.03em; }
.sub { color: var(--mute); font-size: 15px; margin-top: 6px; }
.clock { font-size: 56px; font-weight: 250; letter-spacing: -.02em; line-height: 1; }
.cap { font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); font-weight: 650; margin: 34px 0 14px; display: flex; gap: 10px; align-items: center; }
.cap .stale { letter-spacing: 0; text-transform: none; font-weight: 500; color: var(--warn); }
.cols { display: grid; gap: 0 28px; grid-template-columns: minmax(0, 1fr); }   /* minmax: the hourly strip must scroll, not widen the page */
@media (min-width: 1000px) { .cols { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); } }

/* disruptions */
.sits { display: grid; gap: 10px; margin-top: 22px; }
.sits:empty { display: none; }
.sit { display: flex; gap: 12px; padding: 14px 18px; border-radius: var(--r); background: rgba(251,191,36,.10); border: 1px solid rgba(251,191,36,.28); }
.sit.severe { background: rgba(251,113,133,.12); border-color: rgba(251,113,133,.34); }
.sit svg { flex: none; width: 22px; height: 22px; stroke: var(--warn); fill: none; stroke-width: 2; margin-top: 1px; }
.sit.severe svg { stroke: var(--bad); }
.sit b { display: block; font-size: 15px; } .sit p { margin: 4px 0 0; color: var(--mute); font-size: 13.5px; line-height: 1.4; -webkit-user-select: text; user-select: text; }

body:not(.editing) .hidden { display: none; }
.ehidden { opacity: .38; }
/* last one home */
.leave { margin-top: 22px; padding: 18px 20px; border-radius: var(--r-lg); background: linear-gradient(135deg, rgba(56,189,248,.22), rgba(34,211,238,.12)); border: 1px solid rgba(56,189,248,.4); }
.leave[hidden] { display: none; }
.leave h2 { margin: 0; font-size: 20px; font-weight: 700; } .leave p { margin: 6px 0 0; color: var(--mute); font-size: 14.5px; line-height: 1.45; }
.leave .acts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.leave button { min-height: 48px; padding: 0 20px; border-radius: 999px; font-weight: 650; font-size: 16px; background: rgba(255,255,255,.1); border: 1px solid var(--line); }
.leave button.go { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.leave button:disabled { opacity: .5; }
.leave .door-bad { color: var(--warn); font-weight: 650; }

/* line badge */
.ln { display: inline-grid; place-items: center; min-width: 48px; height: 34px; padding: 0 10px; border-radius: 9px; font-weight: 800; font-size: 18px;
  background: var(--lb); color: var(--lt); flex: none; }
.ln.sm { min-width: 40px; height: 28px; font-size: 15px; border-radius: 7px; }

/* departures: one card per line + direction */
.deps { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 16px; }
.dep { padding: 20px 22px; border-radius: var(--r-lg); background: var(--card); border: 1px solid var(--line); display: grid; gap: 16px; }
.dep .top { display: flex; gap: 14px; align-items: center; }
.dep .to { font-size: 21px; font-weight: 700; line-height: 1.15; }
.dep .to small { display: block; font-size: 13px; color: var(--mute); font-weight: 500; margin-top: 3px; }
.dep .when { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.dep .mins { font-size: 64px; font-weight: 250; letter-spacing: -.03em; line-height: .9; }
.dep .mins small { font-size: 18px; color: var(--mute); margin-left: 6px; letter-spacing: 0; }
.dep .mins.now { color: var(--ok); font-weight: 400; }
.dep .at { text-align: right; color: var(--mute); font-size: 14px; line-height: 1.5; }
.dep .at b { color: var(--ink); font-size: 18px; font-weight: 650; }
.dep .bar { height: 6px; border-radius: 6px; background: rgba(255,255,255,.06); overflow: hidden; }
.dep .bar i { display: block; height: 100%; width: 100%; transform-origin: left; border-radius: 6px; background: linear-gradient(90deg, var(--ok), #22d3ee); transition: transform .3s cubic-bezier(0.23, 1, 0.32, 1); }
.dep.cancelled .mins { color: var(--bad); font-size: 34px; font-weight: 600; }

/* arrivals */
.arrs { display: grid; gap: 8px; }
.arr { display: grid; grid-template-columns: auto 1fr auto auto; gap: 14px; align-items: center; padding: 10px 16px 10px 10px; border-radius: var(--r);
  background: rgba(255,255,255,.035); border: 1px solid var(--line); }
.arr .from { font-size: 16px; font-weight: 600; min-width: 0; }
.arr .from small { display: block; color: var(--mute); font-weight: 400; font-size: 13px; margin-top: 2px; }
.arr .late { font-size: 13px; padding: 4px 9px; border-radius: 999px; background: rgba(251,191,36,.14); color: var(--warn); font-weight: 650; white-space: nowrap; }
.arr .late.ok { background: rgba(52,211,153,.12); color: var(--ok); }
.arr .t { font-size: 20px; font-weight: 600; min-width: 64px; text-align: right; }
.arr .t small { display: block; font-size: 12px; color: var(--mute); font-weight: 400; }
.arr.cancelled .from, .arr.cancelled .t { text-decoration: line-through; color: var(--mute); }

/* weather */
.wx { padding: 20px 22px; border-radius: var(--r-lg); background: var(--card); border: 1px solid var(--line); }
.wx .now { display: flex; align-items: center; gap: 18px; }
.wx .ico { font-size: 64px; line-height: 1; }
.wx .temp { font-size: 64px; font-weight: 250; letter-spacing: -.03em; line-height: 1; }
.wx .cond { font-size: 19px; font-weight: 650; }
.wx .meta { color: var(--mute); font-size: 14px; margin-top: 4px; line-height: 1.45; }
.wx .hint { margin-top: 14px; padding: 10px 14px; border-radius: var(--r); background: rgba(96,165,250,.12); color: #bfdbfe; font-size: 14.5px; font-weight: 550; }
.wx .hint.dry { background: rgba(52,211,153,.10); color: #a7f3d0; }
.hours { display: flex; gap: 6px; overflow-x: auto; margin: 16px -22px 0; padding: 4px 22px 6px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch;
  scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, transparent, #000 18px, #000 calc(100% - 18px), transparent); }
.hours::-webkit-scrollbar { display: none; }
.hr { flex: none; width: 58px; display: grid; justify-items: center; gap: 6px; padding: 10px 0; border-radius: var(--r); scroll-snap-align: start; font-size: 13px; color: var(--mute); }
.hr.first { background: rgba(255,255,255,.06); color: var(--ink); }
.hr .e { font-size: 24px; line-height: 1; } .hr b { font-size: 17px; color: var(--ink); font-weight: 600; }
.hr .p { font-size: 11.5px; color: var(--rain); font-weight: 650; min-height: 14px; }
.days { display: grid; margin-top: 8px; }
.day { display: grid; grid-template-columns: 92px 34px 46px 1fr 46px 56px; gap: 10px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); font-size: 16px; }
.day:first-child { border-top: 0; }
.day .n { font-weight: 650; } .day .e { font-size: 24px; text-align: center; }
.day .lo { color: var(--mute); text-align: right; } .day .hi { font-weight: 650; }
.day .rng { position: relative; height: 6px; border-radius: 6px; background: rgba(255,255,255,.07); }
.day .rng i { position: absolute; top: 0; bottom: 0; border-radius: 6px; background: linear-gradient(90deg, #60a5fa, #34d399 45%, #fbbf24 80%, #fb923c); }
.day .mm { color: var(--rain); font-size: 13px; font-weight: 650; text-align: right; }
.empty { color: var(--mute); font-size: 14px; }
.src { margin-top: 28px; color: var(--mute); font-size: 12px; }
@media (max-width: 700px) {
  .wrap { padding: calc(env(safe-area-inset-top) + 16px) calc(var(--sr) + 16px) calc(env(safe-area-inset-bottom) + 34px) calc(var(--sl) + 16px); }
  h1 { font-size: 32px; } header { padding-right: 0; } .clock { display: none; }
  .deps { grid-template-columns: 1fr; } .dep .mins { font-size: 52px; } .arr { gap: 10px; }
  .wx { padding: 18px; } .hours { margin: 14px -18px 0; padding: 4px 18px 6px; } .wx .ico, .wx .temp { font-size: 54px; }
  .day { grid-template-columns: 78px 30px 38px 1fr 38px 48px; gap: 8px; font-size: 15px; } }
</style>
<link rel="stylesheet" href="/wall.css">
<script src="/addons.js"></script>
<link rel="stylesheet" href="/icons.css">
</head>
<body>
<div class="wrap">
  <header><div><h1 id="title" data-edit="title">Family info</h1><div class="sub" id="sub">–</div></div><div class="clock num" id="clock">–</div></header>
  <section class="leave" id="leave" hidden></section>
  <section class="sits" id="sits"></section>
  <div class="cols">
    <div id="col1">
      <div class="blk" data-blk="deps" data-addon="bus"><div class="cap" data-edit="blk"><span id="depcap">Next buses</span><span class="stale" id="stale"></span></div>
        <section class="deps" id="deps"><span class="empty">Loading departures…</span></section></div>
      <div class="blk" data-blk="wx"><div class="cap" data-edit="blk"><span class="ct">Weather</span></div>
        <section class="wx" id="wxnow"><span class="empty">Loading the forecast…</span></section></div>
    </div>
    <div id="col2">
      <div class="blk" data-blk="days"><div class="cap" data-edit="blk"><span class="ct">Next days</span></div>
        <section class="wx"><div class="days" id="days"></div></section></div>
      <div class="blk" data-blk="arrs"><div class="cap" data-edit="blk"><span class="ct">Arriving at the stop</span></div>
        <section class="arrs" id="arrs"></section></div>
    </div>
  </div>
  <div class="src" data-edit="foot"><span id="srctext">Bus times live from Västtrafik, forecast from MET Norway via Home Assistant. Updates every minute</span><span id="upd"></span>.</div>
</div>
<script src="/edit.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const hm = d => d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
const ms = iso => iso ? new Date(iso).getTime() : NaN;
const badge = (l, sm) => `<span class="ln ${sm ? 'sm' : ''}" style="--lb:${esc(l.backgroundColor || '#fff')};--lt:${esc(l.textColor || '#000')}">${esc(l.shortName)}</span>`;
const WARN = '<svg viewBox="0 0 24 24"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/></svg>';
const COND = { 'sunny': ['<i class="icon icon-sun" aria-hidden="true"></i>', 'Sunny'], 'clear-night': ['<i class="icon icon-moon" aria-hidden="true"></i>', 'Clear'], 'partlycloudy': ['<i class="icon icon-partly" aria-hidden="true"></i>', 'Partly cloudy'], 'cloudy': ['<i class="icon icon-cloud" aria-hidden="true"></i>', 'Cloudy'], 'rainy': ['<i class="icon icon-rain" aria-hidden="true"></i>', 'Rain'],
  'pouring': ['<i class="icon icon-rain" aria-hidden="true"></i>', 'Heavy rain'], 'lightning': ['<i class="icon icon-storm" aria-hidden="true"></i>', 'Thunder'], 'lightning-rainy': ['<i class="icon icon-storm" aria-hidden="true"></i>', 'Thunder and rain'], 'snowy': ['<i class="icon icon-snow" aria-hidden="true"></i>', 'Snow'], 'snowy-rainy': ['<i class="icon icon-snow" aria-hidden="true"></i>', 'Sleet'],
  'hail': ['<i class="icon icon-snow" aria-hidden="true"></i>', 'Hail'], 'fog': ['<i class="icon icon-fog" aria-hidden="true"></i>', 'Fog'], 'windy': ['<i class="icon icon-wind" aria-hidden="true"></i>', 'Windy'], 'windy-variant': ['<i class="icon icon-wind" aria-hidden="true"></i>', 'Windy'], 'exceptional': ['<i class="icon icon-alert" aria-hidden="true"></i>', 'Severe weather'] };
const cond = c => COND[c] || ['<i class="icon icon-thermo" aria-hidden="true"></i>', c || '–'];
const deg = v => v == null ? '–' : Math.round(v) + '°';
let bus = null, wx = null, leave = null, busAt = 0, wxAt = 0;
// layout (edit mode: /familyinfo?edit, opened from Admin). Captions may use {stop} for the bus stop name.
const BLOCKS = { deps: 'Next buses from {stop}', wx: 'Weather', days: 'Next days', arrs: 'Arriving at the stop' };
const DEFAULT_SRC = 'Bus times live from Västtrafik, forecast from MET Norway via Home Assistant. Updates every minute';
const defaults = () => ({ title: 'Family info', foot: DEFAULT_SRC, leave: true, stop: null, arrivals: 8,
  blocks: Object.entries(BLOCKS).map(([id, cap]) => ({ id, cap, show: true })) });
let model = defaults();
const editing = () => document.body.classList.contains('editing');
function applyLayout() {
  $('#title').textContent = model.title || 'Family info'; document.title = model.title || 'Family info';
  $('#srctext').textContent = model.foot ?? DEFAULT_SRC;
  const shown = model.blocks.filter(b => b.show || editing()), half = Math.ceil(shown.length / 2);
  model.blocks.forEach(b => { const el = document.querySelector(`[data-blk="${b.id}"]`); el.classList.toggle('hidden', !b.show && !editing()); el.classList.toggle('ehidden', !b.show); });
  shown.forEach((b, i) => (i < half ? $('#col1') : $('#col2')).appendChild(document.querySelector(`[data-blk="${b.id}"]`)));
  model.blocks.filter(b => !shown.includes(b)).forEach(b => $('#col2').appendChild(document.querySelector(`[data-blk="${b.id}"]`)));
  document.querySelectorAll('.blk').forEach(el => { const b = model.blocks.find(x => x.id === el.dataset.blk), ct = el.querySelector('.ct');
    if (ct) ct.textContent = (b.cap || BLOCKS[b.id]).replace('{stop}', bus?.stop || 'the stop'); });
}
const setModel = l => { model = l && l.blocks ? { ...defaults(), ...l } : defaults(); applyLayout(); busAt = 0; load(true); };
const DOOR = { locked: 'locked', unlocked: 'not locked', open: 'open', jammed: 'jammed', locking: 'locking…', unlocking: 'unlocking' };
let snoozeUntil = 0; try { snoozeUntil = +localStorage.getItem('leaveSnooze') || 0; } catch {}

function renderLeave() {   // the person looking is the only one home: lights and door before they go
  const el = $('#leave'), d = leave;
  const me = d && d.last && (!d.viewer || d.viewer === d.last);
  const todo = d && (d.lights_on.length || d.door !== 'locked');
  if (!me || !todo || Date.now() < snoozeUntil || model.leave === false) { el.hidden = true; return; }
  el.hidden = false;
  const lights = d.lights_on.length ? `${d.lights_on.length} light${d.lights_on.length > 1 ? 's' : ''} on: ${esc(d.lights_on.join(', '))}.` : 'All lights are off.';
  const door = d.door === 'locked' ? 'The front door is locked.' : `<span class="door-bad">The front door is ${esc(DOOR[d.door] || d.door || 'unknown')}.</span>`;
  el.innerHTML = `<h2>${d.viewer ? esc(d.viewer) + ', you are' : esc(d.last) + ' is'} the last one home</h2>
    <p>Leaving? ${lights} ${door}</p><div class="acts">
    ${d.lights_on.length ? '<button class="go" data-do="all_off">Turn off all lights</button>' : ''}
    ${d.door !== 'locked' ? '<button class="go" data-do="lock">Lock the door</button>' : ''}
    <button data-do="snooze">Not now</button></div>`;
}
document.addEventListener('click', async e => {
  const b = e.target.closest('#leave button'); if (!b) return;
  if (b.dataset.do === 'snooze') { snoozeUntil = Date.now() + 3600000; try { localStorage.setItem('leaveSnooze', snoozeUntil); } catch {} return renderLeave(); }
  b.disabled = true; b.textContent = b.dataset.do === 'lock' ? 'Locking…' : 'Turning off…';
  try { await fetch('/api/home/do', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ do: b.dataset.do }) }); } catch {}
  setTimeout(async () => { leave = await get('/api/leave') || leave; renderLeave(); }, b.dataset.do === 'lock' ? 8000 : 2500);
});

function renderBus(now) {
  $('#depcap').textContent = (model.blocks.find(b => b.id === 'deps')?.cap || BLOCKS.deps).replace('{stop}', bus.stop || 'the stop');
  $('#stale').textContent = bus.stale ? '· showing older times, Västtrafik did not answer' : '';
  $('#sits').innerHTML = (bus.situations || []).map(s => `<div class="sit ${s.severity === 'severe' ? 'severe' : ''}">${WARN}<div>
    <b>${s.lines?.length ? 'Line ' + esc(s.lines.join(', ')) + ': ' : ''}${esc(s.title || 'Traffic disruption')}</b>${s.text ? `<p>${esc(s.text)}</p>` : ''}</div></div>`).join('');
  // departures, soonest first; once a bus has left show the following one
  const deps = (bus.departures || []).map(d => {
    const times = [d.next, d.then].filter(x => x && x.time && ms(x.time) > now - 30000);
    return { ...d, cur: times[0], after: times[1] };
  }).filter(d => d.cur).sort((a, b) => ms(a.cur.time) - ms(b.cur.time));
  $('#deps').innerHTML = deps.length ? deps.map(d => {
    const m = Math.max(0, Math.floor((ms(d.cur.time) - now) / 60000)), t = new Date(d.cur.time);
    const mins = d.cur.isCancelled ? 'Cancelled' : m < 1 ? 'Now' : `${m}<small>min</small>`;
    return `<div class="dep ${d.cur.isCancelled ? 'cancelled' : ''}"><div class="top">${badge(d.line)}<div class="to">${esc(d.to)}
        <small>${d.via ? 'via ' + esc(d.via) + ' · ' : ''}${d.platform ? 'stop ' + esc(d.platform) : ''}</small></div></div>
      <div class="when"><div class="mins num ${m < 1 && !d.cur.isCancelled ? 'now' : ''}">${mins}</div>
        <div class="at">leaves <b class="num">${hm(t)}</b>${d.after ? `<br>then <span class="num">${hm(new Date(d.after.time))}</span>` : ''}</div></div>
      <div class="bar"><i style="transform:scaleX(${Math.max(3, 100 - Math.min(100, m / 30 * 100)) / 100})"></i></div></div>`;
  }).join('') : '<span class="empty">No departures in the coming hour.</span>';
  const arrs = (bus.arrivals || []).filter(a => ms(a.time) > now - 60000).slice(0, model.arrivals || 8);
  $('#arrs').innerHTML = arrs.length ? arrs.map(a => {
    const late = Math.round((ms(a.time) - ms(a.planned)) / 60000);
    const lateTag = isNaN(late) || a.cancelled ? '' : late >= 2 ? `<span class="late">${late} min late</span>` : late <= -2 ? `<span class="late ok">${-late} min early</span>` : '<span class="late ok">on time</span>';
    const m = Math.max(0, Math.floor((ms(a.time) - now) / 60000));
    return `<div class="arr ${a.cancelled ? 'cancelled' : ''}">${badge(a.line, true)}<div class="from">from ${esc(a.from)}<small>${a.platform ? 'stop ' + esc(a.platform) : ''}</small></div>
      ${lateTag}<div class="t num">${hm(new Date(a.time))}<small>${a.cancelled ? 'cancelled' : m < 1 ? 'now' : 'in ' + m + ' min'}</small></div></div>`;
  }).join('') : '<span class="empty">No arrivals in the coming hour.</span>';
}

function renderWx(now) {
  const kmh = (wx.units?.wind_speed_unit || 'km/h') === 'km/h', wind = v => v == null ? '–' : Math.round(kmh ? v / 3.6 : v);   // m/s, as Swedish forecasts give it
  const hours = (wx.hourly || []).filter(h => ms(h.datetime) > now - 3600000);
  // rain hint for the next 6 hours: when it starts, or that it stays dry
  const next6 = hours.slice(0, 6), wet = next6.find(h => (h.precipitation || 0) >= 0.2 && (h.precipitation_probability ?? 100) >= 40);
  const total = next6.reduce((a, h) => a + (h.precipitation || 0), 0);
  const hint = wet ? `<div class="hint"><i class="icon icon-rain" aria-hidden="true"></i> ${ms(wet.datetime) <= now ? 'Raining now' : 'Rain from ' + hm(new Date(wet.datetime))} · about ${total.toFixed(1)} mm in the next 6 h</div>`
    : '<div class="hint dry">No rain expected in the next 6 hours</div>';
  const n = wx.now || {}, [e, label] = cond(n.condition);
  const today = (wx.daily || [])[0];
  $('#wxnow').innerHTML = `<div class="now"><div class="ico">${e}</div><div class="temp num">${deg(n.temperature)}</div>
      <div><div class="cond">${esc(label)}</div><div class="meta">${today ? `High ${deg(today.temperature)} · low ${deg(today.templow)}<br>` : ''}Wind <span class="num">${wind(n.wind_speed)}</span> m/s${n.wind_gust_speed ? ` (gusts ${wind(n.wind_gust_speed)})` : ''}</div></div></div>
    ${hint}
    <div class="hours">${hours.map((h, i) => `<div class="hr ${i ? '' : 'first'}"><span>${i ? new Date(h.datetime).getHours().toString().padStart(2, '0') : 'Now'}</span>
      <span class="e">${cond(h.condition)[0]}</span><b class="num">${deg(h.temperature)}</b><span class="p">${(h.precipitation || 0) >= 0.1 ? h.precipitation.toFixed(1) : ''}</span></div>`).join('')}</div>`;
  const days = wx.daily || [], lo = Math.min(...days.map(d => d.templow ?? d.temperature)), hi = Math.max(...days.map(d => d.temperature)), span = Math.max(1, hi - lo);
  const name = (d, i) => i === 0 ? 'Today' : i === 1 ? 'Tomorrow' : new Date(d.datetime).toLocaleDateString([], { weekday: 'long' });
  $('#days').innerHTML = days.map((d, i) => { const l = d.templow ?? d.temperature;
    return `<div class="day"><span class="n">${name(d, i)}</span><span class="e">${cond(d.condition)[0]}</span><span class="lo num">${deg(l)}</span>
      <span class="rng"><i style="left:${(l - lo) / span * 100}%;right:${(hi - d.temperature) / span * 100}%"></i></span><span class="hi num">${deg(d.temperature)}</span>
      <span class="mm num">${(d.precipitation || 0) >= 0.5 ? Math.round(d.precipitation) + ' mm' : ''}</span></div>`; }).join('');
}

function render() {
  const now = Date.now(), small = innerWidth <= 700;
  $('#clock').textContent = hm(new Date());
  $('#sub').textContent = new Date().toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' }) + (small ? ' · ' + hm(new Date()) : '');
  if (bus) renderBus(now);
  if (wx) renderWx(now);
  renderLeave();
  if (busAt) $('#upd').textContent = ' · last update ' + hm(new Date(Math.min(busAt, wxAt || busAt)));
}
async function get(url) { try { const r = await fetch(url, { cache: 'no-store' }); const d = await r.json(); return d.error ? null : d; } catch { return null; } }
async function load(force) {
  if (document.visibilityState !== 'visible') return;
  const now = Date.now(), jobs = [];
  if (force || now - busAt > 15000) jobs.push(get('/api/bus').then(d => { if (d) { bus = d; busAt = Date.now(); } }), get('/api/leave').then(d => { if (d && d.configured) leave = d; }));
  if (force || now - wxAt > 55000) jobs.push(get('/api/weather').then(d => { if (d) { wx = d; wxAt = Date.now(); } }));
  await Promise.all(jobs);
  render();
}
// ---------- edit mode ----------
async function editBlock(id) {
  const i = model.blocks.findIndex(b => b.id === id), b = model.blocks[i];
  const r = await Edit.sheet({ title: 'Edit section', fields: [{ key: 'cap', label: 'Heading', value: b.cap, hint: id === 'deps' ? '{stop} becomes the bus stop name' : '' },
      { key: 'show', label: 'Show this section', type: 'toggle', value: b.show },
      ...(id === 'arrs' ? [{ key: 'n', label: 'How many arrivals', type: 'select', value: model.arrivals || 8, options: [[3, '3'], [5, '5'], [8, '8'], [12, '12']] }] : [])],
    buttons: [{ id: 'up', label: '↑ Earlier', side: true }, { id: 'down', label: '↓ Later', side: true }, { id: 'save', label: 'Save' }] });
  if (!r) return;
  Object.assign(b, { cap: r.values.cap || BLOCKS[id], show: r.values.show });
  if (id === 'arrs') model.arrivals = +r.values.n;
  if (r.action !== 'save') Edit.move(model.blocks, i, r.action === 'up' ? -1 : 1);
  applyLayout(); render();
}
async function editPage() {
  // Which weather entity to read. Home Assistant usually has a couple (met.no,
  // SMHI, a personal station), so it is a list, not a free-text field. If the
  // list cannot be fetched the field drops to text so the id is still editable.
  const wxList = await fetch('/api/ha/entities?domain=weather').then(r => r.ok ? r.json() : []).catch(() => []);
  const wxNow = model.weather?.id || wx?.entity || '';
  if (wxNow && !wxList.some(e => e.id === wxNow)) wxList.unshift({ id: wxNow, name: wxNow });
  const wxField = wxList.length
    ? { key: 'weather', label: 'Weather', type: 'select', value: wxNow, options: wxList.map(e => [e.id, e.name]) }
    : { key: 'weather', label: 'Weather', value: wxNow, hint: 'Home Assistant entity id, for example weather.forecast_home' };
  const r = await Edit.sheet({ title: 'Page settings', fields: [{ key: 'title', label: 'Page title', value: model.title },
      { key: 'stop', label: 'Bus stop', type: 'search', value: bus?.stop || '', picked: model.stop, hint: 'Type a stop name and pick it from the list',
        search: async q => q.length < 2 ? [] : (await (await fetch('/api/bus/stops?q=' + encodeURIComponent(q))).json()).map(x => ({ value: { gid: x.gid, name: x.name }, label: `${x.name} · ${x.municipality}` })) },
      wxField,
      { key: 'leave', label: 'Show the "last one home" reminder', type: 'toggle', value: model.leave !== false }],
    buttons: [{ id: 'save', label: 'Save' }] });
  if (!r) return;
  model.title = r.values.title || 'Family info'; model.leave = r.values.leave; if (r.values.stop) model.stop = r.values.stop;
  const wxPick = (r.values.weather || '').trim();
  if (wxPick !== wxNow) {
    model.weather = wxPick ? { id: wxPick, name: (wxList.find(e => e.id === wxPick) || {}).name || wxPick } : null;
    wxAt = 0;   // the forecast on screen is for the old place
  }
  applyLayout(); renderLeave();
}
document.addEventListener('click', async e => {
  if (!editing() || e.target.closest('#ebar, #eback')) return;
  const el = e.target.closest('[data-edit]'); if (!el) return;
  e.preventDefault(); e.stopPropagation();
  const k = el.dataset.edit;
  if (k === 'blk') editBlock(el.closest('.blk').dataset.blk);
  else if (k === 'title') editPage();
  else if (k === 'foot') { const r = await Edit.sheet({ title: 'Edit footer', fields: [{ key: 'v', label: 'Footer text', type: 'textarea', value: model.foot ?? DEFAULT_SRC }], buttons: [{ id: 'save', label: 'Save' }] });
    if (r) { model.foot = r.values.v; applyLayout(); } }
}, true);
const startEdit = () => Edit.start({ page: 'familyinfo', title: 'Family info', get: () => model, set: setModel, render: () => { applyLayout(); render(); },
  extra: [{ label: 'Page settings', run: editPage }] });

applyLayout();
load(true); setInterval(load, 20000); setInterval(render, 5000);
Edit.load('familyinfo').then(l => { if (l.blocks) setModel(l); if (new URLSearchParams(location.search).has('edit')) startEdit(); });
// iOS pauses timers in the background and restores pages from cache: refresh as soon as the page is shown again
document.addEventListener('visibilitychange', () => load());
addEventListener('pageshow', e => { if (e.persisted) load(true); });
addEventListener('resize', render);
</script>
