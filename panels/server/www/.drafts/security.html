<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#0b0a0d">
<title>Security</title>
<style>
/* Security: one glance answers "is the house OK?". Camera first, then a verdict, the door, alerts, and the
   day's visits as a timeline of snapshots (camwatch: people, faces, vehicles). */
:root { --bg: #0b0a0d; --ink: #f7f5f8; --mute: rgba(247,245,248,.55); --faint: rgba(247,245,248,.12); --line: rgba(255,255,255,.08);
  --ok: #34d399; --warn: #fbbf24; --bad: #f87171; --accent: #f97316;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Inter, Roboto, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
body { background: radial-gradient(60% 40% at 0% 0%, rgba(249,115,22,.16), transparent 70%), radial-gradient(50% 40% at 100% 100%, rgba(52,211,153,.08), transparent 70%), var(--bg); background-attachment: fixed; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1440px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 22px) 28px calc(env(safe-area-inset-bottom) + 40px); }
h1 { margin: 0; font-size: 40px; font-weight: 750; letter-spacing: -.03em; }
.cap { font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); font-weight: 650; margin: 0 0 12px; }
.top { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(300px, 1fr); gap: 30px; margin-top: 22px; align-items: start; }
@media (max-width: 980px) { .top { grid-template-columns: 1fr; } }

.cam { position: relative; border-radius: 30px; overflow: hidden; background: #000; aspect-ratio: 16/9; box-shadow: 0 20px 60px rgba(0,0,0,.5); cursor: pointer; }
.cam img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cam .live { position: absolute; top: 16px; left: 16px; display: inline-flex; align-items: center; gap: 8px; padding: 7px 13px; border-radius: 999px; background: rgba(0,0,0,.55); font-size: 12.5px; font-weight: 700; letter-spacing: .08em; }
.cam .live i { width: 9px; height: 9px; border-radius: 50%; background: #ef4444; animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.cam .tap { position: absolute; bottom: 16px; right: 16px; padding: 8px 14px; border-radius: 999px; background: rgba(0,0,0,.55); font-size: 12.5px; }

.verdict { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; padding: 6px 0 18px; }
.shield { width: 82px; height: 82px; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 40% 30%, #6ee7b7, #10b981 60%, #065f46); box-shadow: 0 0 40px rgba(52,211,153,.35); }
.shield svg { width: 38px; height: 38px; fill: none; stroke: #052e1f; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.verdict.warn .shield { background: radial-gradient(circle at 40% 30%, #fde68a, #f59e0b 60%, #92400e); box-shadow: 0 0 40px rgba(251,191,36,.35); }
.verdict.warn .shield svg { stroke: #3b2300; }
.verdict b { font-size: 26px; font-weight: 700; letter-spacing: -.01em; display: block; }
.verdict span { color: var(--mute); font-size: 14px; }
.door { position: relative; height: 66px; border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid var(--line); overflow: hidden; touch-action: none; margin: 4px 0 16px; }
.door .lbl { position: absolute; inset: 0; display: grid; place-items: center; font-size: 15px; color: var(--mute); font-weight: 550; pointer-events: none; }
.door .knob { position: absolute; top: 5px; left: 5px; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--warn); color: #241a00; }
.door .knob svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
.door .knob.anim { transition: left .2s; }
.door.locked { border-color: rgba(52,211,153,.35); background: rgba(52,211,153,.07); } .door.locked .knob { left: calc(100% - 61px); background: var(--ok); }
.door.locked .lbl { color: var(--ok); }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.tog { display: inline-flex; align-items: center; gap: 12px; padding: 10px 18px 10px 10px; border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid var(--line); font-size: 14px; font-weight: 600; }
.tog .sw { width: 46px; height: 28px; border-radius: 999px; background: rgba(255,255,255,.15); position: relative; transition: background .15s; }
.tog .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: left .15s; }
.tog.on .sw { background: var(--accent); } .tog.on .sw::after { left: 21px; }
.who { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.who span { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid var(--line); font-size: 13px; }
.who i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 700; font-size: 12px; background: #2a2833; color: var(--mute); }
.who .h i { background: #10b981; color: #052e1f; }

.stats { display: flex; gap: 34px; flex-wrap: wrap; margin: 34px 0 20px; }
.stat b { font-size: 38px; font-weight: 250; display: block; line-height: 1; } .stat span { color: var(--mute); font-size: 13px; }
.visits { position: relative; display: grid; gap: 14px; padding-left: 26px; }
.visits::before { content: ""; position: absolute; left: 8px; top: 8px; bottom: 8px; width: 2px; background: var(--line); }
.v { position: relative; display: grid; grid-template-columns: 170px 1fr; gap: 18px; align-items: center; }
.v::before { content: ""; position: absolute; left: -24px; top: 50%; width: 14px; height: 14px; margin-top: -7px; border-radius: 50%; background: var(--bg); border: 3px solid var(--faint); }
.v.known::before { border-color: var(--ok); } .v.car::before { border-color: #60a5fa; } .v.unknown::before { border-color: var(--warn); }
.v img { width: 170px; aspect-ratio: 16/9; object-fit: cover; border-radius: 18px; background: #18161c; cursor: pointer; }
.v b { font-size: 16px; } .v .t { color: var(--mute); font-size: 13px; margin-top: 3px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.tag { font-size: 11.5px; padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.06); color: var(--mute); }
.tag.p { background: rgba(52,211,153,.15); color: #6ee7b7; } .tag.u { background: rgba(251,191,36,.14); color: #fcd34d; } .tag.c { background: rgba(96,165,250,.15); color: #93c5fd; }
.more { margin-top: 16px; padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line); color: var(--mute); }
#ov { position: fixed; inset: 0; z-index: 20; display: none; place-items: center; background: rgba(4,3,6,.92); padding: 16px; }
#ov.open { display: grid; } #ov img { max-width: 100%; max-height: 88vh; border-radius: 20px; }
#ov .x { position: absolute; top: calc(env(safe-area-inset-top) + 16px); right: 18px; width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,.12); font-size: 20px; }
.hint { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px); transform: translate(-50%, 16px); opacity: 0; z-index: 40; padding: 10px 16px;
  border-radius: 999px; background: #1d1a22; border: 1px solid var(--line); font-size: 14px; transition: opacity .15s, transform .15s; pointer-events: none; }
.hint.show { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 700px) { .wrap { padding: 18px 16px 40px; } h1 { font-size: 32px; } .v { grid-template-columns: 120px 1fr; gap: 12px; } .v img { width: 120px; border-radius: 14px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; } }
#sw { position: fixed; top: calc(env(safe-area-inset-top) + 16px); right: 18px; z-index: 30; width: 46px; height: 46px; border-radius: 50%;
  background: rgba(255,255,255,.08); border: 1px solid var(--line); display: grid; place-items: center; }
#sw svg { width: 20px; height: 20px; fill: currentColor; }
#swp { position: fixed; inset: 0; z-index: 29; display: none; background: rgba(6,5,8,.86); padding: 90px 22px; }
#swp.open { display: block; }
#swp nav { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
#swp a { display: block; padding: 16px 18px; border-radius: 999px; background: rgba(255,255,255,.07); border: 1px solid var(--line); color: var(--ink); text-decoration: none; font-weight: 600; }
#swp a small { display: block; color: var(--mute); font-weight: 400; font-size: 12px; } #swp a.on { background: #c2410c; border-color: transparent; }
</style>
</head>
<body>
<button id="sw" aria-label="All panels"><svg viewBox="0 0 24 24"><circle cx="5" cy="5" r="2.2"/><circle cx="12" cy="5" r="2.2"/><circle cx="19" cy="5" r="2.2"/><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/><circle cx="5" cy="19" r="2.2"/><circle cx="12" cy="19" r="2.2"/><circle cx="19" cy="19" r="2.2"/></svg></button>
<div id="swp"><nav id="swnav"></nav></div>
<div class="wrap">
  <h1>Securccity</h1>
  <div class="top">
    <section><div class="cam" id="cam"><img id="snap" alt="Front camera"><span class="live"><i></i>LIVE · FRONT</span><span class="tap">Tap for video</span></div></section>
    <section>
      <div class="verdict" id="verdict"><div class="shield"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.4 8-8 9-4.6-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg></div>
        <div><b id="vt">Checking…</b><span id="vs"></span></div></div>
      <div class="door" id="door"><div class="lbl" id="door-lbl">–</div><div class="knob"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0"/></svg></div></div>
      <div class="row"><button class="tog" id="detect"><span class="sw"></span>Camera alerts to phones</button></div>
      <div class="who" id="who"></div>
    </section>
  </div>
  <div class="stats" id="stats"></div>
  <div class="cap">Visits at the front door</div>
  <section class="visits" id="visits"></section>
  <button class="more" id="more">Show yesterday too</button>
</div>
<div id="ov"><img id="ov-img" alt=""><button class="x" id="ov-x" aria-label="Close">✕</button></div>
<div class="hint" id="hint"></div>
<script>
const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const PANELS = [['/', 'Deck', 'wall panel'], ['/living', 'Home', 'lights, music, door'], ['/family', 'Family', "who's home"], ['/security', 'Security', 'camera, visits'],
  ['/media', 'Media', 'music, speakers, TV'], ['/net', 'Network', 'internet, devices'], ['/ops', 'Lab', 'Proxmox'], ['/ambient', 'Ambient', 'night clock'],
  ['/remote', 'Remote', 'phone'], ['/network.html', 'Network map', 'document']];
$('#swnav').innerHTML = PANELS.map(([u, t, s]) => `<a href="${u}" class="${location.pathname.replace(/\/$/, '') === u ? 'on' : ''}">${t}<small>${s}</small></a>`).join('');
$('#sw').addEventListener('click', () => $('#swp').classList.toggle('open'));
$('#swp').addEventListener('click', e => { if (e.target.id === 'swp') $('#swp').classList.remove('open'); });
function hint(t) { const h = $('#hint'); h.textContent = t; h.classList.add('show'); clearTimeout(h._t); h._t = setTimeout(() => h.classList.remove('show'), 1700); }
const post = (u, b) => fetch(u, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) }).then(r => r.json().then(j => { if (!r.ok) throw new Error(j.error || r.status); return j; }));
function tap(el, fn) { let d = null; el.addEventListener('pointerdown', e => d = { x: e.clientX, y: e.clientY });
  el.addEventListener('pointerup', e => { if (d && Math.hypot(e.clientX - d.x, e.clientY - d.y) < 10) fn(e); d = null; }); el.addEventListener('pointercancel', () => d = null); }

const CAM = 'camera.4e02cadpag62de9_main';
let H = null, days = 1, holdDoor = 0, busy = false;
function snap() { if (busy || document.visibilityState !== 'visible' || $('#ov').classList.contains('open')) return; busy = true;
  const im = new Image(); im.onload = () => { $('#snap').src = im.src; busy = false; }; im.onerror = () => busy = false;
  im.src = `/api/cam/${CAM}/snap?w=${Math.min(1600, Math.round($('#cam').clientWidth * (devicePixelRatio || 1)))}&t=${Date.now()}`; }
tap($('#cam'), () => { $('#ov-img').src = `/api/cam/${CAM}/stream?t=${Date.now()}`; $('#ov').classList.add('open'); });
tap($('#ov-x'), () => { $('#ov').classList.remove('open'); $('#ov-img').src = ''; snap(); });

function setDoor(state) { const d = $('#door'); d.classList.toggle('locked', state === 'locked'); d.querySelector('.knob').style.left = '';
  $('#door-lbl').textContent = state === 'locked' ? 'Front door locked' : state === 'unlocked' ? 'Slide to lock the front door  ›' : 'Lock offline'; }
(() => { const door = $('#door'), knob = door.querySelector('.knob'); let d = null;
  knob.addEventListener('pointerdown', e => { if (door.classList.contains('locked')) return hint('Unlock from the lock app'); d = e.clientX; knob.setPointerCapture(e.pointerId); knob.classList.remove('anim'); });
  knob.addEventListener('pointermove', e => { if (d == null) return; knob.style.left = 5 + Math.max(0, Math.min(door.clientWidth - 66, e.clientX - d)) + 'px'; });
  knob.addEventListener('pointerup', e => { if (d == null) return; const x = e.clientX - d; d = null; knob.classList.add('anim');
    if (x > (door.clientWidth - 66) * .8) { holdDoor = Date.now() + 8000; setDoor('locked'); $('#door-lbl').textContent = 'Locking…'; post('/api/home/do', { do: 'lock' }).catch(e => hint('✗ ' + e.message)); }
    else knob.style.left = ''; });
})();
tap($('#detect'), () => { $('#detect').classList.toggle('on'); post('/api/home/do', { do: 'detect' }).then(() => setTimeout(loadHome, 600)).catch(e => hint('✗ ' + e.message)); });

function verdict() {
  if (!H) return;
  const home = (H.people || []).filter(p => p.home), locked = H.door && H.door.state === 'locked', issues = [];
  if (!locked) issues.push(H.door && H.door.state === 'unlocked' ? 'front door is unlocked' : 'door lock is offline');
  if (!home.length && !H.detect) issues.push('nobody home and camera alerts are off');
  $('#verdict').classList.toggle('warn', issues.length > 0);
  $('#vt').textContent = issues.length ? 'Needs a look' : 'House secure';
  $('#vs').textContent = issues.length ? issues.join(' · ') : `${locked ? 'Door locked' : ''} · alerts ${H.detect ? 'on' : 'off'} · ${home.length ? home.length + ' home' : 'nobody home'}`;
}
async function loadHome() {
  try { H = await (await fetch('/api/home/state')).json(); } catch { return; }
  if (!H.configured || H.error) return;
  if (holdDoor < Date.now()) setDoor(H.door.state);
  $('#detect').classList.toggle('on', !!H.detect);
  $('#who').innerHTML = (H.people || []).map(p => `<span class="${p.home ? 'h' : ''}"><i>${esc(p.name[0])}</i>${esc(p.name)} ${p.home ? 'home' : 'away'}</span>`).join('');
  verdict();
}
const fmt = s => new Date(s).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
async function loadVisits() {
  let v; try { v = await (await fetch(`/api/sec/visits?days=${days}&limit=${days * 80}`)).json(); } catch { return; }
  if (!Array.isArray(v)) return;
  const today = new Date().toLocaleDateString('sv-SE'), td = v.filter(x => x.day === today || days > 1);
  const known = td.filter(x => x.people.length), unknown = td.reduce((a, x) => a + x.unknown, 0), cars = td.filter(x => x.labels.some(l => /car|truck|bus|motorcycle/.test(l)));
  $('#stats').innerHTML = [[td.length, days > 1 ? 'visits, 2 days' : 'visits today'], [new Set(known.flatMap(x => x.people.map(p => p.name))).size, 'people recognised'],
    [unknown, 'unknown faces'], [cars.length, 'with a vehicle']].map(([n, l]) => `<div class="stat"><b class="num">${n}</b><span>${l}</span></div>`).join('');
  $('#visits').innerHTML = td.length ? td.map(x => {
    const names = x.people.map(p => p.name), car = x.labels.some(l => /car|truck|bus|motorcycle/.test(l));
    const title = names.length ? names.join(' & ') : x.unknown ? 'Someone not recognised' : car ? 'Vehicle' : x.labels.includes('person') ? 'Person (face not visible)' : (x.labels[0] || 'Movement');
    const secs = Math.max(1, Math.round((new Date(x.end) - new Date(x.start)) / 1000));
    return `<div class="v ${names.length ? 'known' : car ? 'car' : x.unknown ? 'unknown' : ''}"><img loading="lazy" src="/api/sec/thumb/${x.day}/${x.stem}.jpg?w=360" data-full="/api/sec/thumb/${x.day}/${x.stem}.jpg?w=1280" alt="">
      <div><b>${esc(title)}</b><div class="t">${x.day !== today ? 'yesterday ' : ''}${fmt(x.start)} · ${secs} s${x.star ? ' · ★ saved to iCloud' : ''}</div>
      <div class="tags">${names.map(n => `<span class="tag p">${esc(n)}</span>`).join('')}${x.unknown ? `<span class="tag u">${x.unknown} unknown face${x.unknown > 1 ? 's' : ''}</span>` : ''}
      ${x.labels.map(l => `<span class="tag ${/car|truck|bus/.test(l) ? 'c' : ''}">${esc(l)}</span>`).join('')}${(x.plates || []).map(p => `<span class="tag c">${esc(p.plate || p)}</span>`).join('')}</div></div></div>`;
  }).join('') : '<span class="cap" style="text-transform:none;letter-spacing:0">No visits yet today.</span>';
  document.querySelectorAll('.v img').forEach(im => tap(im, () => { $('#ov-img').src = im.dataset.full; $('#ov').classList.add('open'); }));
}
tap($('#more'), () => { days = days === 1 ? 2 : 1; $('#more').textContent = days === 1 ? 'Show yesterday too' : 'Only today'; loadVisits(); });
snap(); loadHome(); loadVisits();
setInterval(snap, 2000); setInterval(loadHome, 5000); setInterval(loadVisits, 30000);
document.addEventListener('visibilitychange', () => { snap(); loadHome(); });
</script>
<script src="/start.js" defer></script>
</body>
</html>
