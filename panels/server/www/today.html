<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#07080f">
<meta name="apple-mobile-web-app-title" content="Today"><meta name="nav-related" content="/pulse,/family,/security,/start">
<title>Today</title>
<link rel="stylesheet" href="/deck.css">
<style>
/* Today: the day as one story. A 24 h ribbon (who was home, camera visits, now), "Coming up" (buses, weather, sun),
   and "Earlier today": arrivals/departures, camera visits, news, lab events merged in time order, with filters.
   Data: /api/family, /api/sec/visits, /api/bus, /api/weather, /api/home/state, /api/news, /api/ops/snapshot */
:root { --hue: #22d3ee; --hue2: #f472b6; }
.ribbon { padding: 16px 18px 12px; }
.rb-hours { position: relative; height: 16px; color: var(--faint); font-size: 10.5px; margin-left: 86px; }
.rb-hours span { position: absolute; transform: translateX(-50%); }
.lane { display: grid; grid-template-columns: 86px 1fr; align-items: center; height: 26px; }
.lane b { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 7px; } .lane b i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.track { position: relative; height: 12px; border-radius: 6px; background: rgba(255,255,255,.05); }
.seg { position: absolute; top: 0; bottom: 0; border-radius: 6px; background: color-mix(in srgb, var(--c) 70%, transparent); }
.camdot { position: absolute; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #fff; border: 2px solid #fb7185; }
.nowln { position: absolute; top: -4px; bottom: -4px; width: 2px; background: #fff; border-radius: 2px; opacity: .8; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 4px; position: sticky; top: 0; z-index: 5; padding: calc(var(--st) * 0 + 8px) 0;
  background: linear-gradient(var(--bg) 75%, transparent); }
.filters button { padding: 8px 14px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 13.5px; font-weight: 600; }
.filters button.on { background: var(--ink); color: #141a20; border-color: transparent; }
.cols { display: grid; gap: 0 22px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 980px) { .cols { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); } }
.ev { display: grid; grid-template-columns: 58px 30px 1fr; gap: 10px; align-items: start; padding: 11px 0; border-bottom: 1px solid var(--line); }
.ev:last-child { border-bottom: 0; }
.ev time { font-size: 14px; font-weight: 650; color: var(--ink); text-align: right; padding-top: 2px; font-variant-numeric: tabular-nums; }
.ev time small { display: block; font-size: 11px; color: var(--faint); font-weight: 500; }
.ev .ic { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; font-size: 15px; background: color-mix(in srgb, var(--c) 18%, transparent); color: var(--c); }
.ev .tx b { display: block; font-size: 15px; font-weight: 600; line-height: 1.3; } .ev .tx span { color: var(--mute); font-size: 13px; line-height: 1.4; display: block; margin-top: 2px; }
.ev .tx img { width: 100%; max-width: 280px; border-radius: 12px; margin-top: 8px; display: block; aspect-ratio: 16/9; object-fit: cover; background: #111; }
@media (hover: hover) and (pointer: fine) { .ev a.tx:hover b { text-decoration: underline; } }
.feed { padding: 4px 16px; }
.hours { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: none; } .hours::-webkit-scrollbar { display: none; }
.hr { flex: none; width: 56px; text-align: center; padding: 8px 0; border-radius: 14px; background: var(--card); border: 1px solid var(--line); font-size: 12px; color: var(--mute); }
.hr b { display: block; font-size: 16px; color: var(--ink); margin: 2px 0; } .hr .e { font-size: 20px; display: block; } .hr .p { color: var(--blue); font-size: 11px; font-weight: 650; min-height: 13px; display: block; }
.hidden { display: none !important; }
</style>
<link rel="stylesheet" href="/wall.css">
</head>
<body>
<div class="wrap">
  <header class="head"><div><h1>Today</h1><div class="sub" id="date">–</div></div><div class="right"><div class="clock num" id="clock">–</div></div></header>
  <section class="card ribbon" id="ribbon"><div class="empty">Loading the day…</div></section>
  <div class="filters" id="filters"></div>
  <div class="cols">
    <div><div class="cap">Coming up</div><section class="card feed" id="ahead"></section>
      <div class="cap">Next hours</div><div class="hours" id="hours"></div></div>
    <div><div class="cap">Earlier today <small id="count"></small></div><section class="card feed" id="past"><div class="empty">Loading…</div></section></div>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const D = {}, AT = {};
const COL = { Alex: '#38bdf8', Robin: '#f472b6', Sam: '#34d399', Kim: '#f59e0b' };
const KIND = { people: ['People', '#7dd3fc'], camera: ['Camera', '#fb7185'], travel: ['Travel', '#22d3ee'], news: ['News', '#fbbf24'], lab: ['Lab', '#60a5fa'], sky: ['Sky', '#f59e0b'] };
const WX = { 'sunny': '☀️', 'clear-night': '🌙', 'partlycloudy': '⛅', 'cloudy': '☁️', 'rainy': '🌧️', 'pouring': '🌧️', 'lightning': '🌩️', 'lightning-rainy': '⛈️',
  'snowy': '❄️', 'snowy-rainy': '🌨️', 'hail': '🌨️', 'fog': '🌫️', 'windy': '💨', 'windy-variant': '💨', 'exceptional': '⚠️' };
const hm = t => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
let filter = 'all'; try { filter = localStorage.getItem('todayFilter') || 'all'; } catch {}
async function get(k, url, every) {
  if (AT[k] && Date.now() - AT[k] < every) return;
  try { const r = await fetch(url, { cache: 'no-store' }); const j = await r.json(); if (!j.error) { D[k] = j; AT[k] = Date.now(); } } catch {}
}
function events() {
  const ev = [], midnight = new Date(); midnight.setHours(0, 0, 0, 0); const m0 = midnight.getTime();
  const F = D.family;
  if (F) F.people.forEach(p => p.segments.forEach((s, i) => { if (i === 0 || s.from * 1000 < m0) return;
    ev.push({ k: 'people', t: s.from * 1000, ic: s.home ? '⌂' : '↗', c: COL[p.name], title: `${p.name} ${s.home ? 'came home' : 'left'}`, sub: s.home ? 'Phone back on the home Wi-Fi' : 'Phone left the home Wi-Fi', href: '/family' }); }));
  (D.visits || []).forEach(v => { const t = new Date(v.start).getTime(); if (t < m0) return;
    const who = (v.people || []).map(p => p.name || p).join(', ');
    ev.push({ k: 'camera', t, ic: '◎', title: who ? `${who} at the front door` : `Front camera: ${(v.labels || []).join(', ') || 'motion'}`,
      sub: [v.vehicles?.length ? v.vehicles.length + ' vehicle(s)' : '', v.plates?.length ? 'plate ' + v.plates.join(', ') : '', v.unknown ? v.unknown + ' unknown' : ''].filter(Boolean).join(' · ') || 'Recorded clip',
      img: v.has_jpg ? `/api/sec/thumb/${v.day}/${v.stem}.jpg?w=480` : '', href: '/security' }); });
  (D.news?.items || []).forEach(n => { if (!n.at || n.at * 1000 < m0) return;
    ev.push({ k: 'news', t: n.at * 1000, ic: '❝', title: n.title, sub: 'SVT Väst' + (n.desc ? ' · ' + n.desc.slice(0, 110) + (n.desc.length > 110 ? '…' : '') : ''), href: n.link, ext: true }); });
  (D.snap?.feed || []).forEach(f => { if (!f.at || f.at * 1000 < m0) return;
    ev.push({ k: 'lab', t: f.at * 1000, ic: f.ok ? '✓' : '!', title: `Lab: ${f.label}${f.target && f.target !== 'all' ? ' ' + f.target : ''}`, sub: f.msg || '', href: '/ops' }); });
  return ev.sort((a, b) => b.t - a.t);
}
function ahead() {
  const out = [], now = Date.now();
  if (D.bus) (D.bus.departures || []).forEach(d => [d.next, d.then].forEach((x, i) => { if (!x?.time) return; const t = new Date(x.time).getTime();
    if (t > now - 30000 && t < now + 90 * 60000) out.push({ k: 'travel', t, ic: '🚌', title: `${d.line.shortName} to ${d.to}${d.via ? ' via ' + d.via : ''}`,
      sub: `Leaves ${D.bus.stop}${d.platform ? ', stop ' + d.platform : ''} · in ${Math.max(0, Math.round((t - now) / 60000))} min${x.isCancelled ? ' · CANCELLED' : ''}` }); }));
  (D.bus?.situations || []).forEach(s => out.push({ k: 'travel', t: now, ic: '⚠', title: s.title || 'Traffic disruption', sub: s.text || '' }));
  const sun = D.home?.sun;
  if (sun) [['next_setting', '🌇', 'Sunset'], ['next_rising', '🌅', 'Sunrise']].forEach(([k, ic, n]) => { const t = new Date(sun[k]).getTime();
    if (t > now && t < now + 18 * 3600000) out.push({ k: 'sky', t, ic, title: n, sub: `${n} at ${hm(t)}`, href: '/pulse' }); });
  const hourly = D.weather?.hourly || [];
  const wet = hourly.slice(0, 8).find(h => (h.precipitation || 0) >= .3 && (h.precipitation_probability ?? 100) >= 40);
  if (wet) out.push({ k: 'sky', t: Math.max(now, new Date(wet.datetime).getTime()), ic: '☔', title: 'Rain expected', sub: `${(wet.precipitation || 0).toFixed(1)} mm around ${hm(wet.datetime)} (${Math.round(wet.precipitation_probability || 0)}%)` });
  return out.sort((a, b) => a.t - b.t).slice(0, 12);
}
function evRow(e, future) {
  const [, c] = KIND[e.k], tag = e.href && e.href.startsWith('http') ? 'a href="' + esc(e.href) + '" target="_blank" rel="noopener"' : e.href ? `a href="${esc(e.href)}"` : 'div';
  const close = tag.startsWith('a') ? 'a' : 'div';
  const mn = Math.round((e.t - Date.now()) / 60000), rel = future ? (mn <= 0 ? 'now' : mn < 90 ? `in ${mn} min` : `in ${Math.round(mn / 60)} h`) : '';
  return `<div class="ev ${filter !== 'all' && filter !== e.k ? 'hidden' : ''}" style="--c:${e.c || c}"><time>${hm(e.t)}<small>${esc(rel)}</small></time><span class="ic">${esc(e.ic)}</span>
    <${tag} class="tx"><b>${esc(e.title)}</b>${e.sub ? `<span>${esc(e.sub)}</span>` : ''}${e.img ? `<img src="${esc(e.img)}" alt="" loading="lazy">` : ''}</${close}></div>`;
}
function ribbon() {
  const F = D.family; if (!F) return;
  const m0 = F.midnight * 1000, span = 86400000, pct = t => Math.max(0, Math.min(100, (t - m0) / span * 100));
  const hours = [0, 3, 6, 9, 12, 15, 18, 21, 24].map(h => `<span style="left:${h / 24 * 100}%">${String(h).padStart(2, '0')}</span>`).join('');
  const cams = {}; (F.camera || []).forEach(c => (cams[c.name] = cams[c.name] || []).push(new Date(c.at).getTime()));
  $('#ribbon').innerHTML = `<div class="rb-hours">${hours}</div>` + F.people.map(p => `<div class="lane" style="--c:${COL[p.name] || '#38bdf8'}"><b><i></i>${esc(p.name)}</b>
    <div class="track">${p.segments.filter(s => s.home).map(s => `<div class="seg" style="left:${pct(s.from * 1000)}%;width:${pct(s.to * 1000) - pct(s.from * 1000)}%"></div>`).join('')}
    ${(cams[p.name] || []).map(t => `<span class="camdot" style="left:${pct(t)}%" title="camera ${hm(t)}"></span>`).join('')}<span class="nowln" style="left:${pct(Date.now())}%"></span></div></div>`).join('');
}
function render() {
  const now = new Date();
  $('#date').textContent = now.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' });
  $('#clock').textContent = hm(now);
  ribbon();
  const past = events(), fut = ahead();
  const counts = {}; past.forEach(e => counts[e.k] = (counts[e.k] || 0) + 1); fut.forEach(e => counts[e.k] = (counts[e.k] || 0) + 1);
  $('#filters').innerHTML = [['all', 'All', past.length + fut.length], ...Object.entries(KIND).map(([k, [n]]) => [k, n, counts[k] || 0]).filter(x => x[2])]
    .map(([k, n, c]) => `<button data-f="${k}" class="${filter === k ? 'on' : ''}">${esc(n)} <span class="faint">${c}</span></button>`).join('');
  $('#ahead').innerHTML = fut.map(e => evRow(e, true)).join('') || '<div class="empty">Nothing scheduled in the next hours.</div>';
  $('#past').innerHTML = past.map(e => evRow(e, false)).join('') || '<div class="empty">A quiet day so far.</div>';
  $('#count').textContent = past.length ? past.length + ' events' : '';
  const hrs = (D.weather?.hourly || []).filter(h => new Date(h.datetime) > Date.now() - 3600000).slice(0, 12);
  $('#hours').innerHTML = hrs.map((h, i) => `<div class="hr">${i ? new Date(h.datetime).getHours().toString().padStart(2, '0') : 'Now'}<span class="e">${WX[h.condition] || '·'}</span><b class="num">${Math.round(h.temperature)}°</b><span class="p">${(h.precipitation || 0) >= .1 ? h.precipitation.toFixed(1) : ''}</span></div>`).join('');
}
$('#filters').addEventListener('click', e => { const b = e.target.closest('button[data-f]'); if (!b) return; filter = b.dataset.f; try { localStorage.setItem('todayFilter', filter); } catch {} render(); });
async function load() {
  if (document.visibilityState !== 'visible') return;
  await Promise.all([get('family', '/api/family', 60000), get('visits', '/api/sec/visits?days=1&limit=80', 60000), get('bus', '/api/bus', 25000),
    get('weather', '/api/weather', 300000), get('home', '/api/home/state', 60000), get('news', '/api/news?f=vast', 300000), get('snap', '/api/ops/snapshot', 60000)]);
  render();
}
load(); setInterval(load, 15000); setInterval(render, 30000);
document.addEventListener('visibilitychange', load);
</script>
<script src="/nav.js" defer></script>
</body>
</html>
