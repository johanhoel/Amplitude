<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#000000">
<title>Ambient</title>
<style>
/* Ambient: a calm always-on clock for a hallway or bedside screen. Day = soft colour; night (22-06, or after
   sunset past 21) = dim amber on black. The whole layout drifts a few pixels each minute (no burn-in).
   Tap anywhere at night: full brightness for 30 s. */
:root { --ink: #f4f2fb; --mute: rgba(244,242,251,.5); --accent: #a78bfa; --glow: rgba(124,92,255,.35);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Inter, Roboto, sans-serif; }
body.night { --ink: rgba(255,147,84,.78); --mute: rgba(255,147,84,.38); --accent: rgba(255,120,60,.7); --glow: transparent; }
body.night.wake { --ink: #ffd2b0; --mute: rgba(255,190,150,.6); --accent: #ff8a4c; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; color: var(--ink); font-family: var(--font); overflow: hidden; -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent; cursor: none; }
.bg { position: fixed; inset: -20%; background: radial-gradient(40% 35% at 30% 30%, rgba(124,92,255,.32), transparent 70%), radial-gradient(35% 30% at 75% 70%, rgba(34,211,238,.18), transparent 70%);
  animation: breathe 30s ease-in-out infinite alternate; transition: opacity 2s; }
body.night .bg { opacity: 0; }
@keyframes breathe { to { transform: translate(3%, -2%) scale(1.06); } }
.stage { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; padding: calc(env(safe-area-inset-top) + 4vh) 5vw calc(env(safe-area-inset-bottom) + 4vh);
  transition: transform 3s ease; }
.top { display: flex; justify-content: space-between; align-items: center; padding-right: 64px; color: var(--mute); font-size: clamp(14px, 1.6vw, 22px); }
.pill { display: inline-flex; align-items: center; gap: 10px; }
.pill i { width: .6em; height: .6em; border-radius: 50%; background: currentColor; }
.ok { color: #34d399; } .warn { color: #fbbf24; }
body.night .ok, body.night .warn { color: var(--mute); }
.center { display: grid; place-items: center; }
.clockwrap { position: relative; width: min(64vh, 78vw); aspect-ratio: 1; display: grid; place-items: center; }
.clockwrap svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.clock { font-size: min(19vh, 23vw); font-weight: 150; letter-spacing: -.05em; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 0 60px var(--glow); }
.date { font-size: min(3.2vh, 4.6vw); color: var(--mute); text-transform: capitalize; margin-top: 1.6vh; text-align: center; }
.event { font-size: min(2.6vh, 3.8vw); color: var(--accent); margin-top: 1.4vh; text-align: center; min-height: 1.3em; }
.bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 4vw; }
.wx { display: flex; align-items: center; gap: 1.6vw; }
.wx svg { width: min(9vh, 12vw); height: min(9vh, 12vw); fill: none; stroke: var(--ink); stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.wx b { font-size: min(8vh, 11vw); font-weight: 200; line-height: 1; }
.wx div span { display: block; color: var(--mute); font-size: min(2.2vh, 3.4vw); margin-top: .4vh; text-transform: capitalize; }
.fam { display: flex; gap: 1.4vw; }
.fam span { display: grid; justify-items: center; gap: .6vh; font-size: min(1.9vh, 3vw); color: var(--mute); }
.fam i { width: min(6.4vh, 9vw); height: min(6.4vh, 9vw); border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 650; font-size: min(2.8vh, 4vw);
  border: 2px solid var(--mute); color: var(--mute); }
.fam .h i { border-color: var(--ink); color: var(--ink); background: color-mix(in srgb, var(--accent) 22%, transparent); }
@media (max-width: 700px) { .bottom { flex-direction: column; align-items: flex-start; gap: 3vh; } .fam { align-self: stretch; justify-content: space-between; } }
#sw { position: fixed; top: calc(env(safe-area-inset-top) + 16px); right: 18px; z-index: 30; width: 46px; height: 46px; border-radius: 50%; opacity: .25;
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08); display: grid; place-items: center; color: var(--ink); cursor: pointer; }
#sw svg { width: 20px; height: 20px; fill: currentColor; }
#swp { position: fixed; inset: 0; z-index: 29; display: none; background: rgba(0,0,0,.88); padding: 90px 22px; cursor: default; }
#swp.open { display: block; }
#swp nav { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
#swp a { display: block; padding: 16px 18px; border-radius: 999px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.08); color: #f4f2fb; text-decoration: none; font-weight: 600; font-family: var(--font); }
#swp a small { display: block; color: rgba(244,242,251,.5); font-weight: 400; font-size: 12px; } #swp a.on { background: #5b4bd6; }
</style>
<link rel="stylesheet" href="/icons.css">
</head>
<body>
<div class="bg"></div>
<button id="sw" aria-label="All panels"><svg viewBox="0 0 24 24"><circle cx="5" cy="5" r="2.2"/><circle cx="12" cy="5" r="2.2"/><circle cx="19" cy="5" r="2.2"/><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/><circle cx="5" cy="19" r="2.2"/><circle cx="12" cy="19" r="2.2"/><circle cx="19" cy="19" r="2.2"/></svg></button>
<div id="swp"><nav id="swnav"></nav></div>
<div class="stage" id="stage">
  <div class="top"><span class="pill" id="door"><i></i>–</span><span class="pill" id="alerts"><i></i>–</span></div>
  <div class="center"><div class="clockwrap"><svg viewBox="0 0 200 200" id="ring"></svg>
    <div><div class="clock" id="clock">--:--</div><div class="date" id="date"></div><div class="event" id="event"></div></div></div></div>
  <div class="bottom"><div class="wx"><svg viewBox="0 0 48 48" id="wxi"></svg><div><b class="num" id="temp">--°</b><span id="wxs"></span></div></div><div class="fam" id="fam"></div></div>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const PANELS = [['/', 'Deck', 'wall panel'], ['/living', 'Home', 'lights, music, door'], ['/family', 'Family', "who's home"], ['/security', 'Security', 'camera, visits'],
  ['/media', 'Media', 'music, speakers, TV'], ['/net', 'Network', 'internet, devices'], ['/ops', 'Lab', 'Proxmox'], ['/ambient', 'Ambient', 'night clock'],
  ['/remote', 'Remote', 'phone'], ['/network.html', 'Network map', 'document']];
$('#swnav').innerHTML = PANELS.map(([u, t, s]) => `<a href="${u}" class="${location.pathname.replace(/\/$/, '') === u ? 'on' : ''}">${t}<small>${s}</small></a>`).join('');
$('#sw').addEventListener('click', e => { e.stopPropagation(); $('#swp').classList.toggle('open'); });
$('#swp').addEventListener('click', e => { if (e.target.id === 'swp') $('#swp').classList.remove('open'); });

const WX = { sunny: 'sun', 'clear-night': 'moon', partlycloudy: 'partly', cloudy: 'cloud', fog: 'fog', rainy: 'rain', pouring: 'rain', lightning: 'storm',
  'lightning-rainy': 'storm', snowy: 'snow', 'snowy-rainy': 'snow', windy: 'wind', 'windy-variant': 'wind', hail: 'snow' };
const ICON = {
  sun: '<circle cx="24" cy="24" r="8"/><path d="M24 6v5M24 37v5M6 24h5M37 24h5M11.3 11.3l3.5 3.5M33.2 33.2l3.5 3.5M11.3 36.7l3.5-3.5M33.2 14.8l3.5-3.5"/>',
  moon: '<path d="M34 30a13 13 0 1 1-16-16 10 10 0 0 0 16 16z"/>',
  partly: '<circle cx="18" cy="17" r="6"/><path d="M18 5v3M7 17H4M9.5 8.5l2 2M26.5 8.5l-2 2"/><path d="M15 37h20a7 7 0 0 0 0-14 9 9 0 0 0-17-1 7.5 7.5 0 0 0-3 15z"/>',
  cloud: '<path d="M13 36h22a8 8 0 0 0 0-16 10 10 0 0 0-19-2 9 9 0 0 0-3 18z"/>',
  rain: '<path d="M13 30h22a8 8 0 0 0 0-16 10 10 0 0 0-19-2 9 9 0 0 0-3 18z"/><path d="M17 35l-2 5M25 35l-2 5M33 35l-2 5"/>',
  storm: '<path d="M13 28h22a8 8 0 0 0 0-16 10 10 0 0 0-19-2 9 9 0 0 0-3 18z"/><path d="M25 30l-4 7h6l-4 7"/>',
  snow: '<path d="M13 28h22a8 8 0 0 0 0-16 10 10 0 0 0-19-2 9 9 0 0 0-3 18z"/><path d="M18 35v6M15 38h6M30 35v6M27 38h6"/>',
  fog: '<path d="M8 20h32M12 27h28M8 34h26"/>', wind: '<path d="M6 18h24a5 5 0 1 0-5-5M6 26h32a5 5 0 1 1-5 5M6 34h16"/>' };
let H = null, F = null, wake = 0;
function isNight() { const h = new Date().getHours(); const set = H && H.sun && H.sun.state === 'below_horizon';
  return h >= 22 || h < 6 || (set && h >= 21); }
function tick() {
  const d = new Date(), s = d.getSeconds() + d.getMilliseconds() / 1000;
  $('#clock').textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
  $('#date').textContent = d.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' });
  const R = 96, C = 2 * Math.PI * R, f = s / 60;
  $('#ring').innerHTML = `<circle cx="100" cy="100" r="${R}" fill="none" stroke="currentColor" stroke-opacity=".08" stroke-width="1.2"/>
    <circle cx="100" cy="100" r="${R}" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="${(C * f).toFixed(2)} ${C}"/>
    <circle cx="${100 + R * Math.cos(f * 2 * Math.PI)}" cy="${100 + R * Math.sin(f * 2 * Math.PI)}" r="2.6" fill="var(--accent)"/>`;
  document.body.classList.toggle('night', isNight()); document.body.classList.toggle('wake', Date.now() < wake);
}
function drift() { const m = new Date().getMinutes(); $('#stage').style.transform = `translate(${Math.sin(m) * 10}px, ${Math.cos(m * 1.3) * 8}px)`; }
document.addEventListener('pointerdown', e => { if (e.target.closest('#sw, #swp')) return; wake = Date.now() + 30000; tick(); });
function render() {
  if (H && H.configured) {
    const w = H.wx || {}, door = H.door && H.door.state;
    const noWx = w.temperature == null || ['unavailable', 'unknown', null].includes(w.condition);   // weather service glitch: show only the sun
    $('#temp').textContent = noWx ? '' : `${Math.round(w.temperature)}°`; $('#wxi').style.display = noWx ? 'none' : '';
    const t = iso => iso ? new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false }) : '';
    const sunTxt = H.sun ? (H.sun.state === 'below_horizon' ? `sunrise ${t(H.sun.next_rising)}` : `sunset ${t(H.sun.next_setting)}`) : '';
    $('#wxs').textContent = [noWx ? '' : (w.condition || '').replace('partlycloudy', 'partly cloudy').replace(/[-_]/g, ' '), w.humidity != null ? `${Math.round(w.humidity)}% humidity` : '', sunTxt].filter(Boolean).join(' · ');
    $('#wxi').innerHTML = ICON[WX[w.condition] || 'cloud'];
    $('#door').className = 'pill ' + (door === 'locked' ? 'ok' : 'warn'); $('#door').lastChild.textContent = door === 'locked' ? 'Door locked' : door === 'unlocked' ? 'Door unlocked' : 'Door lock offline';
    $('#alerts').className = 'pill ' + (H.detect ? 'ok' : ''); $('#alerts').lastChild.textContent = H.detect ? 'Camera alerts on' : 'Camera alerts off';
    $('#fam').innerHTML = (H.people || []).map(p => `<span class="${p.home ? 'h' : ''}"><i>${esc(p.name[0])}</i>${esc(p.name)}</span>`).join('');
  }
  if (F && F.people) {   // latest arrival/departure today
    let ev = null;
    F.people.forEach(p => p.segments.forEach((s, i) => { if (i > 0 && s.from > (ev ? ev.t : 0)) ev = { t: s.from, name: p.name, home: s.home }; }));
    $('#event').textContent = ev ? `${ev.name} ${ev.home ? 'came home' : 'left'} ${new Date(ev.t * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false })}` : '';
  }
}
async function load() { try { H = await (await fetch('/api/home/state')).json(); } catch {} render(); }
async function loadF() { try { F = await (await fetch('/api/family')).json(); } catch {} render(); }
tick(); drift(); load(); loadF();
setInterval(tick, 250); setInterval(drift, 60000); setInterval(load, 30000); setInterval(loadF, 120000);
</script>
<script src="/start.js" defer></script>
<script src="/cam.js" defer></script>
</body>
</html>
