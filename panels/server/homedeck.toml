# Home Deck settings - every address, entity, phone, timer and list the panels use.
#
# How to change something safely:
#   1. edit this file (in the Home Deck editor, or nano /opt/panel-wrapper/homedeck.toml)
#   2. run  homedeck-apply   (the editor does this for you when you save)
#      It checks every value first. A typo is reported with the line/setting and nothing is restarted.
#      If the panels do not answer after the restart, the previous version is put back automatically.
#   Even if a broken file gets in another way, the server keeps running on the last good copy and the
#   Admin page shows what is wrong.
#
# TOML in 20 seconds:  name = "text"   number = 30   list = ["a", "b"]   a [section] groups the lines below it.
# Names with dots or colons need quotes:  "light.bed_table" = [...]   "02:00:ae:6e:6f:73" = "Alex's phone"
# Secrets (Home Assistant token, Genelec password, ntfy topic) are NOT here: they stay in
# /var/lib/panel-wrapper/secrets.json and are set from the panels' settings.

[server]
port = 80
static_dir = "/opt/panel-wrapper/www"
netaudio = "/opt/panel-wrapper/venv/bin/netaudio"
timezone = "Europe/Stockholm"

[homeassistant]
url = "https://192.168.1.70:8123"

[services]
pc = "192.168.1.200:8765"                         # deck-listener on the Windows PC (answers while the PC is on)
pc_proxy_clients = ["192.168.1.70", "192.168.1.195", "127.0.0.1"]   # who may use /api/pc/mic (HA desk buttons)
labpanel = "http://192.168.1.234:8790"            # lab panel service on monitor
lab_panel_id = "lab"                                # the panel id the Buttons keys use (tile/lab/N.png)
prometheus = "http://192.168.1.234:9090"
camfeed = "http://192.168.1.81:8091"              # camwatch-feed (visits, thumbnails, latest event)
ollama = "http://192.168.1.200:11434"             # Ollama on the PC (Local AI chat; the PC firewall allows .52)
ntfy = "https://ntfy.sh"                            # home notices go here (topic is in secrets.json)
piholes = ["192.168.1.30", "192.168.1.31"]

[entities]
spotify = "media_player.spotify_alex"
lock = "lock.front_door"                             # front door (lock.front_door_2 is tried too if this one is unavailable)
charger = "switch.garage_charger_enabled"
charger_power_prefix = "sensor.garage_"             # the Easee power sensor starts with this
cam_detect = "input_boolean.cameradetection"
wake_pc = "button.wake_on_lan_02_00_9a_b2_d1_b1"
tv = "media_player.tv_rum"
vacuum = "vacuum.roborock_s6_maxv"
weather = "weather.forecast_home"                   # met.no
apple_tv = "media_player.vardagsrum"
apple_tv_remote = "remote.vardagsrum"

# media players on the Media / Deck pages (in this order)
[[players]]
entity = "media_player.spotify_alex"
label = "Spotify"
[[players]]
entity = "media_player.tv_rum"
label = "TV room · Sonos Beam"
[[players]]
entity = "media_player.bathroom_speaker"
label = "Bathroom speaker"
[[players]]
entity = "media_player.vardagsrum"
label = "Living room · Apple TV"

[apple_tv]
commands = ["up", "down", "left", "right", "select", "menu", "home", "top_menu", "play_pause",
            "skip_backward", "skip_forward", "volume_up", "volume_down"]

# phone/remote panel -> deck-listener path on the PC (only these can be run)
[pc_actions]
lock = "/lock"
mic = "/mic"
snip = "/key/snip"
nextmonitor = "/key/nextmonitor"
desktop = "/key/desktop"
sleep = "/sleep"
taskmgr = "/taskmgr"
gamemode = "/gamemode"
discord-mute = "/key/discord-mute"
discord-deafen = "/key/discord-deafen"
clip = "/key/clip"
overlay = "/key/overlay"
battlefield = "/place/battlefield"
camera = "/camera"

[rooms]
order = ["Vardagsrum", "Kök", "Hall nedervåning", "Kontor", "Master bed", "Allrum vån 2", "Sam",
         "Kim", "Uterum", "Garage", "Utebelysning"]
skip_lights = "infrared|_ble$"                      # lights whose id matches are hidden (regular expression)

[rooms.names]                                       # lights whose HA name does not say the room: entity = [short name, room]
"light.bed_table" = ["Bed table", "Master bed"]
"light.garage_led_strip" = ["LED strip", "Garage"]
"light.brytare_entre_1" = ["Entré switch 1", "Hall nedervåning"]
"light.brytare_entre_2" = ["Entré switch 2", "Hall nedervåning"]

[presence]
# Phones must use a fixed Wi-Fi address at home (iOS: Private Wi-Fi Address = Fixed or Off).
# Measured 2026-10-18: daytime silence at home < 7 min (Alex), < 11 (Sam), < 29 (Kim);
# asleep the phones go quiet 30-120 min, so at night someone home stays home unless silent for night_limit_s.
default_away_after_s = 900
night_hours = [0, 7]                                # local hours [start, end)
night_limit_s = 14400
probe_after_s = 240                                 # quiet this long -> wake the phone and check ARP
probe_trust_s = 21600                               # failed wake-ups only count if the phone answered one this recently
cam_burst_s = 360                                   # after a front-camera event: scan every 15 s for this long
cam_leave_silent_s = 90
# camera leave rule, for people whose phone never answers a wake-up probe (so a failed probe proves nothing):
# their phone was active around a front-camera event, then stays silent this long -> away at once
# (instead of waiting for away_after_s). New activity from the phone makes them home again.
cam_leave_people = ["kim"]
cam_leave_after_s = 600

[presence.phones]                                   # person = [Wi-Fi MAC addresses]
alex = ["02:00:ae:6e:6f:73"]                       # Alex's iPhone (.138); the Z Fold7 is not always with him
sam = ["02:00:66:fb:ba:8e"]                    # Sam's iPhone (.155)
robin = ["02:00:b2:e4:22:d0"]                     # Robin's iPhone (.149/.171)
kim = ["02:00:14:cf:a7:ac", "02:00:19:70:f6:13"]   # Kim's iPhone "Kim-2" + second iPhone (private address)

[presence.away_after_s]                             # daytime silence before someone counts as away
alex = 600
sam = 720
robin = 720
kim = 1800

[audio]
genelecs = ["192.168.1.90", "192.168.1.91", "192.168.1.92"]
front_pair = ["Genelec-000001", "Genelec-000002"]   # the two 4430s (L/R) whose Dante input is switched

[audio.sources.pc]
device = "DESKTOP-PC01"
channels = ["01", "02"]

[audio.sources.bt]
device = "AU-BT2-000001"
channels = ["Bluetooth OUT 1", "Bluetooth OUT 2"]

[transit]
bus_stop = "9021014001000000"                       # Storgatan; the Family info editor can pick another
feed = "https://avgangstavla.vasttrafik.se/api/events?board1Gids={g}&board1Modules=departures&board1Modules=trafficSituations&board2Gids={g}&board2Modules=arrivals"
stop_search = "https://avgangstavla.vasttrafik.se/api/stopAreas"

[leave]
grace_s = 180                                       # nobody home this long before the door is checked
lock_check_s = 45                                   # a lock command should have locked the door by then

[layouts]
pages = ["admin", "start", "familyinfo"]            # pages with an edit mode
keep = 30                                           # older saves kept per page (undo)

[admin]
# Pages that ask for the admin PIN (names as in the address, e.g. "admin" for /admin; "network" = /network.html)
pages = ["admin", "ops", "lab", "net", "atlas", "network", "devices", "studio", "localai"]
pin_min_digits = 4
session_hours = 12                                  # how long a PIN unlocks a browser
remember_days = 30                                  # with "remember this device"
max_tries = 5                                       # wrong PINs before that address is locked out
lock_minutes = 5

[news]
max_items = 40

[news.feeds]
vast = "https://www.svt.se/nyheter/lokalt/vast/rss.xml"
all = "https://www.svt.se/nyheter/rss.xml"

