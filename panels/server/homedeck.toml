# Home Deck settings - every address, entity, phone, timer and list the panels use.
#
# How to change something safely:
#   1. edit this file (in the Home Deck editor, or nano /opt/panel-wrapper/homedeck.toml)
#   2. run  homedeck-apply   (the editor does this for you when you save)
#      It checks every value first. A typo is reported with the line/setting and nothing is restarted.
#      If the panels do not answer after the restart, the previous version is put back automatically.
#   Even if a broken file gets in another way, the server keeps running on the last good copy and the
#   Admin page shows what is wrong.
#
# An empty value means this house does not have that thing, and the panel for it stays away: no
# Genelecs, no volume dial; no PC, no wake button; no bus stop, no departures. So a fresh install
# shows nothing but the rooms and lights until you fill something in. The setup wizard
# (http://<machine>:8089) scans the network, reads Home Assistant and offers the values below.
#
# TOML in 20 seconds:  name = "text"   number = 30   list = ["a", "b"]   a [section] groups the lines below it.
# Names with dots or colons need quotes:  "light.bed_table" = [...]   "02:00:ae:6e:6f:73" = "Anna's phone"
# Secrets (Home Assistant token, Genelec password, ntfy topic) are NOT here: they stay in
# /var/lib/panel-wrapper/secrets.json and are set from the panels' settings.

# The media players on the Media / Deck pages, in this order. It sits at the top because a list of
# tables has to come before the first [section]; the setup wizard writes it from what Home Assistant has.
#   [[players]]
#   entity = "media_player.living_room"
#   label = "Living room"
players = []

[server]
port = 80
static_dir = "/opt/panel-wrapper/www"
netaudio = "/opt/panel-wrapper/venv/bin/netaudio"
timezone = "Europe/Stockholm"

[homeassistant]
url = "__HA_URL__"    # written by the installer from the address you type at setup

# Other machines the panels talk to. Each one empty = that part of the panels is not shown.
[services]
pc = ""                                             # deck-listener on a Windows PC, host:port (wake, mic, keys)
pc_proxy_clients = []                               # who may use /api/pc/mic (e.g. the Home Assistant server)
labpanel = ""                                       # lab panel service, http://ADDRESS:8790
lab_panel_id = "lab"                                # the panel id the Buttons keys use (tile/lab/N.png)
buttons_panel = ""                                  # the Buttons page the Deck shows, e.g. http://ADDRESS:4440/device/<id>
prometheus = ""                                     # http://ADDRESS:9090, for the graphs on Ops
camfeed = ""                                        # camwatch-feed (visits, thumbnails, latest event)
ollama = ""                                         # http://ADDRESS:11434, for Local AI chat
ntfy = "https://ntfy.sh"                            # home notices go here (topic is in secrets.json)
piholes = []                                        # Pi-hole addresses; who is on the network comes from them

# Home Assistant entities. Empty = that card, button or reading is not shown.
[entities]
spotify = ""                                        # the music player on Media and Deck
lock = ""                                           # front door; the leave check watches it
charger = ""                                        # car charger switch
charger_power_prefix = ""                           # the charger's power sensor starts with this
cam_detect = ""                                     # the input_boolean that turns motion alerts on
wake_pc = ""                                        # wake-on-LAN button for the PC
tv = ""
vacuum = ""
weather = ""
apple_tv = ""
apple_tv_remote = ""

[apple_tv]
commands = ["up", "down", "left", "right", "select", "menu", "home", "top_menu", "play_pause",
            "skip_backward", "skip_forward", "volume_up", "volume_down"]

# phone/remote panel -> deck-listener path on the PC (only these can be run)
[pc_actions]
lock = "/lock"
mic = "/mic"
snip = "/key/snip"
nextmonitor = "/key/nextmonitor"
desktop = "/key/desktop"
sleep = "/sleep"
taskmgr = "/taskmgr"
gamemode = "/gamemode"
discord-mute = "/key/discord-mute"
discord-deafen = "/key/discord-deafen"
clip = "/key/clip"
overlay = "/key/overlay"
camera = "/camera"

[rooms]
order = []                                          # the rooms in the order you want them; the rest follow, A-Z
skip_lights = "infrared|_ble$"                      # lights whose id matches are hidden (regular expression)

[rooms.names]                                       # lights whose HA name does not say the room: entity = [short name, room]

# People on Start and Family come from Home Assistant. These settings are only needed when you want
# who-is-home to follow the phones on the Wi-Fi instead of Home Assistant's own guess, which needs Pi-holes.
[people]
hide = []                                           # person entities the panels should not show

[presence]
# Phones must use a fixed Wi-Fi address at home (iOS: Private Wi-Fi Address = Fixed or Off).
# Measured in a house of four: daytime silence at home stayed under 7-29 min per phone;
# asleep the phones go quiet 30-120 min, so at night someone home stays home unless silent for night_limit_s.
default_away_after_s = 900
night_hours = [0, 7]                                # local hours [start, end)
night_limit_s = 14400
probe_after_s = 240                                 # quiet this long -> wake the phone and check ARP
probe_trust_s = 21600                               # failed wake-ups only count if the phone answered one this recently
cam_burst_s = 360                                   # after a front-camera event: scan every 15 s for this long
cam_leave_silent_s = 90
# camera leave rule, for people whose phone never answers a wake-up probe (so a failed probe proves nothing):
# their phone was active around a front-camera event, then stays silent this long -> away at once
# (instead of waiting for away_after_s). New activity from the phone makes them home again.
cam_leave_people = []
cam_leave_after_s = 600

[presence.phones]                                   # person = [Wi-Fi MAC addresses], e.g. anna = ["02:00:ae:6e:6f:73"]

[presence.away_after_s]                             # person = daytime silence before they count as away

[audio]
genelecs = []                                       # Genelec speaker addresses; with none there is no volume dial
front_pair = []                                     # the two speakers (L/R) whose Dante input is switched

[audio.sources]                                     # name = { device = "Dante device", channels = ["01", "02"] }

[transit]
bus_stop = ""                                       # 16-digit Västtrafik stop id; the Family info editor can pick one
feed = "https://avgangstavla.vasttrafik.se/api/events?board1Gids={g}&board1Modules=departures&board1Modules=trafficSituations&board2Gids={g}&board2Modules=arrivals"
stop_search = "https://avgangstavla.vasttrafik.se/api/stopAreas"

[leave]
grace_s = 180                                       # nobody home this long before the door is checked
lock_check_s = 45                                   # a lock command should have locked the door by then

[layouts]
pages = ["admin", "start", "familyinfo"]            # pages with an edit mode
keep = 30                                           # older saves kept per page (undo)

[admin]
# Pages that ask for the admin PIN (names as in the address, e.g. "admin" for /admin)
pages = ["admin", "ops", "lab", "net", "atlas", "devices", "studio", "localai"]
pin_min_digits = 4
session_hours = 12                                  # how long a PIN unlocks a browser
remember_days = 30                                  # with "remember this device"
max_tries = 5                                       # wrong PINs before that address is locked out
lock_minutes = 5

[news]
max_items = 40

[news.feeds]
vast = "https://www.svt.se/nyheter/lokalt/vast/rss.xml"
all = "https://www.svt.se/nyheter/rss.xml"

# status dots on Start / Admin: id = address probed from this server (any HTTP answer = up).
# These are Home Deck's own pages. Everything else in the house goes under [links.extra], which is
# what the setup wizard fills in from what it found - keeping the two apart means a later run of the
# wizard can replace its own list without touching these.
[links]
deck = "http://127.0.0.1/"
living = "http://127.0.0.1/living"
remote = "http://127.0.0.1/remote"
media = "http://127.0.0.1/media"
family = "http://127.0.0.1/family"
familyinfo = "http://127.0.0.1/familyinfo"
security = "http://127.0.0.1/security"
ambient = "http://127.0.0.1/ambient"
desktop = "http://127.0.0.1/desktop"
editor = "http://127.0.0.1:8088/"
ops = "http://127.0.0.1/ops"
net = "http://127.0.0.1/net"
start = "http://127.0.0.1/start"
admin = "http://127.0.0.1/admin"
pulse = "http://127.0.0.1/pulse"
today = "http://127.0.0.1/today"
rooms = "http://127.0.0.1/rooms"
control = "http://127.0.0.1/control"
atlas = "http://127.0.0.1/atlas"

[links.extra]                                       # name = "http://ADDRESS/" for the router, the NVR, a Pi-hole...

# Network panel: names by the last number of the IP address = [group, name]
[network.names]                                     # "30" = ["Servers", "Pi-hole"]

# Network panel: names for devices on DHCP, by MAC address
[network.mac_names]                                 # "02:00:db:ab:da:dc" = "Anna's phone"

[remote]
# Access from the internet through the edge server: only paired devices (Android app, phones' home-screen web app).
# Pair on /devices (admin PIN) while the phone is on the home Wi-Fi. Removing a device there locks it out at once.
edge = []                                           # the edge proxy's address; its requests must carry a paired device's key
public_url = ""                                     # the address phones use, e.g. https://home.example.net:8126
pair_minutes = 10                                   # how long a pairing code / QR code is valid
