# ALSA configuration for DStreamer
# Everything played to the default device goes to the Virgil virtual soundcard,
# which sends it to the Dante network. Virgil mixes several players itself.

pcm_type.virgil {
  lib "/usr/lib/x86_64-linux-gnu/alsa-lib/libasound_module_pcm_virgil.so"
}

pcm.virgil_hw {
  type virgil
  hint { show on description "Virgil Virtual Soundcard (raw)" }
}

pcm.virgil {
  type plug
  slave.pcm "virgil_hw"
  hint { show on description "Virgil Virtual Soundcard" }
}

pcm.!default "virgil"
