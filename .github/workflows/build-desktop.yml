name: Build DanteStreamer Desktop Apps

on:
  push:
    paths:
      - 'dantestreamer-desktop/**'
      - '.github/workflows/build-desktop.yml'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows EXE (self-contained)
        working-directory: dantestreamer-desktop/windows
        run: |
          dotnet restore
          dotnet publish DanteStreamerController.csproj -c Release -r win-x64 --self-contained=true --output publish

      - name: Create archive
        shell: pwsh
        working-directory: dantestreamer-desktop/windows/publish
        run: |
          $files = Get-ChildItem -File
          $files | Compress-Archive -DestinationPath ../DanteStreamerController-windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dantestreamer-desktop/windows/DanteStreamerController-windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Swift binary
        working-directory: dantestreamer-desktop/macos
        run: swift build -c release

      - name: Create app structure
        working-directory: dantestreamer-desktop/macos
        run: |
          mkdir -p DanteStreamer.app/Contents/MacOS
          mkdir -p DanteStreamer.app/Contents/Resources
          cp .build/release/DanteStreamerController DanteStreamer.app/Contents/MacOS/
          chmod +x DanteStreamer.app/Contents/MacOS/DanteStreamerController
          touch DanteStreamer.app/Contents/PkgInfo
          echo "APPL????" > DanteStreamer.app/Contents/PkgInfo

      - name: Create Info.plist
        working-directory: dantestreamer-desktop/macos
        run: |
          cat > DanteStreamer.app/Contents/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>DanteStreamerController</string>
            <key>CFBundleIdentifier</key>
            <string>com.dantestreamer.controller</string>
            <key>CFBundleName</key>
            <string>DanteStreamer Controller</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
            <key>NSPrincipalClass</key>
            <string>NSApplication</string>
          </dict>
          </plist>
          EOF

      - name: Import Developer ID Certificate
        env:
          CERT_BASE64: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          echo $CERT_BASE64 | base64 -d > cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "" build.keychain

      - name: Code sign app with Developer ID
        working-directory: dantestreamer-desktop/macos
        env:
          TEAM_ID: ${{ secrets.DEVELOPER_ID_TEAM }}
        run: |
          codesign -s "Developer ID Application: Johan Hoel ($TEAM_ID)" --deep --force DanteStreamer.app
          codesign -v DanteStreamer.app

      - name: Create archive
        working-directory: dantestreamer-desktop/macos
        run: zip -r DanteStreamer-macos.zip DanteStreamer.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dantestreamer-desktop/macos/DanteStreamer-macos.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: always() && needs.build-macos.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloads

      - name: Prepare release files
        run: |
          mkdir -p release
          if [ -d "downloads/windows" ]; then cp downloads/windows/* release/ || true; fi
          if [ -d "downloads/macos" ]; then cp downloads/macos/* release/ || true; fi
          ls -lah release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          tag_name: desktop-v1.0.${{ github.run_number }}
          draft: false
          prerelease: true
          body: |
            ## DanteStreamer Desktop v1.0

            ### macOS
            Extract ZIP, double-click `DanteStreamer.app` to run.
            Requires macOS 12.0+

            ### Windows
            Extract ZIP, run `DanteStreamerController.exe`.
            Requires Windows 10+. Includes all dependencies.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
