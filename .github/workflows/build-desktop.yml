name: Build DanteStreamer Desktop Apps

on:
  push:
    paths:
      - 'dantestreamer-desktop/**'
      - '.github/workflows/build-desktop.yml'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows EXE (self-contained)
        working-directory: dantestreamer-desktop/windows
        run: |
          dotnet publish DanteStreamerController.csproj -c Release -r win-x64 --self-contained=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none --output publish

      - name: Create archive
        shell: pwsh
        working-directory: dantestreamer-desktop/windows/publish
        run: |
          Compress-Archive -Path DanteStreamerController.exe -DestinationPath ../DanteStreamerController-windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dantestreamer-desktop/windows/DanteStreamerController-windows.zip

  build-macos:
    runs-on: macos-latest
    outputs:
      notarized: ${{ steps.notarize.outputs.notarized }}
    steps:
      - uses: actions/checkout@v4

      # Universal binary (Apple silicon and Intel). Compiler errors are
      # repeated as annotations, so they show on the run page without logs.
      - name: Build Swift binary
        working-directory: dantestreamer-desktop/macos
        run: |
          set +e
          swift build -c release --arch arm64 --arch x86_64 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          grep -E ': (error|warning): ' build.log | sort -u | head -40 | \
            sed -E "s#^$GITHUB_WORKSPACE/##; s#^([^:]+):([0-9]+):([0-9]+): (error|warning): (.*)\$#::\4 file=\1,line=\2,col=\3::\5#"
          exit $status

      - name: Create app structure
        working-directory: dantestreamer-desktop/macos
        run: |
          mkdir -p DanteStreamer.app/Contents/MacOS
          mkdir -p DanteStreamer.app/Contents/Resources
          cp .build/apple/Products/Release/DanteStreamerController DanteStreamer.app/Contents/MacOS/
          chmod +x DanteStreamer.app/Contents/MacOS/DanteStreamerController
          echo "APPL????" > DanteStreamer.app/Contents/PkgInfo

      - name: Create Info.plist
        working-directory: dantestreamer-desktop/macos
        run: |
          cat > DanteStreamer.app/Contents/Info.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>DanteStreamerController</string>
            <key>CFBundleIdentifier</key>
            <string>com.dantestreamer.controller</string>
            <key>CFBundleName</key>
            <string>DanteStreamer Controller</string>
            <key>CFBundleDisplayName</key>
            <string>DanteStreamer Controller</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.${{ github.run_number }}</string>
            <key>CFBundleVersion</key>
            <string>${{ github.run_number }}</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
            <key>LSApplicationCategoryType</key>
            <string>public.app-category.utilities</string>
            <key>NSPrincipalClass</key>
            <string>NSApplication</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>NSAppTransportSecurity</key>
            <dict>
              <key>NSAllowsArbitraryLoads</key>
              <true/>
            </dict>
            <key>NSLocalNetworkUsageDescription</key>
            <string>DanteStreamer Controller connects to DanteStreamer hosts on your network.</string>
          </dict>
          </plist>
          EOF
          plutil -lint DanteStreamer.app/Contents/Info.plist

      - name: Import Developer ID Certificate
        env:
          CERT_BASE64: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          echo "$CERT_BASE64" | base64 -d > cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "" build.keychain
          rm cert.p12

      - name: Code sign app with Developer ID
        working-directory: dantestreamer-desktop/macos
        env:
          TEAM_ID: ${{ secrets.DEVELOPER_ID_TEAM }}
        run: |
          codesign -s "Developer ID Application: Johan Hoel ($TEAM_ID)" --force --options runtime --timestamp DanteStreamer.app
          codesign -v --strict --verbose=2 DanteStreamer.app

      # Notarize with an App Store Connect API key (APPLE_API_KEY_ID,
      # APPLE_API_ISSUER_ID, APPLE_API_KEY_BASE64 = the .p8 file in base64)
      # or an Apple ID (APPLE_ID, APPLE_APP_PASSWORD = app-specific password).
      # Without either, the app stays signed but not notarized.
      - name: Notarize and staple
        id: notarize
        working-directory: dantestreamer-desktop/macos
        env:
          TEAM_ID: ${{ secrets.DEVELOPER_ID_TEAM }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -n "$API_KEY_ID" ] && [ -n "$API_ISSUER_ID" ] && [ -n "$API_KEY_BASE64" ]; then
            echo "$API_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
            auth=(--key "$RUNNER_TEMP/AuthKey.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID")
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            auth=(--apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$TEAM_ID")
          else
            echo "::warning::No notarization secrets set; the app is signed but not notarized."
            exit 0
          fi
          ditto -c -k --keepParent DanteStreamer.app notarize.zip
          xcrun notarytool submit notarize.zip "${auth[@]}" --wait --timeout 30m --output-format json | tee notarize.json
          id=$(plutil -extract id raw notarize.json)
          if [ "$(plutil -extract status raw notarize.json)" != "Accepted" ]; then
            xcrun notarytool log "$id" "${auth[@]}" || true
            echo "::error::Notarization was not accepted"
            exit 1
          fi
          xcrun stapler staple DanteStreamer.app
          spctl --assess --type execute --verbose DanteStreamer.app
          echo "notarized=1" >> "$GITHUB_OUTPUT"

      - name: Create archive
        working-directory: dantestreamer-desktop/macos
        run: ditto -c -k --keepParent DanteStreamer.app DanteStreamer-macos.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dantestreamer-desktop/macos/DanteStreamer-macos.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    # Publish the macOS build even when the Windows job fails.
    if: always() && needs.build-macos.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloads

      - name: Prepare release files
        run: |
          mkdir -p release
          find downloads -type f -name "*.zip" -exec cp {} release/ \;
          ls -lah release/

      - name: List release files
        run: ls -lah release/ || echo "No release folder"

      - name: Create Release
        run: |
          TAG="desktop-v1.0.${{ github.run_number }}"
          BODY='## DanteStreamer Desktop v1.0

          ### macOS
          Extract the ZIP and open `DanteStreamer.app`. Requires macOS 12 or later, on Apple silicon or Intel. Signed with a Developer ID and notarized by Apple.

          ### Windows
          Extract the ZIP and run `DanteStreamerController.exe`. Requires Windows 10 or later. The .NET runtime is included.'

          # Create release
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/releases \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"DanteStreamer Desktop v1.0\",\"body\":\"$BODY\",\"draft\":false,\"prerelease\":true}")

          RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id // empty')
          if [ -z "$RELEASE_ID" ]; then
            echo "Failed to create release:"
            echo "$RESPONSE" | jq .
            exit 1
          fi

          echo "Release created with ID: $RELEASE_ID"

          # Upload artifacts
          for file in release/*.zip; do
            if [ -f "$file" ]; then
              echo "Uploading $file..."
              curl -s -X POST \
                -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                -H "Content-Type: application/zip" \
                --data-binary "@$file" \
                "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$(basename $file)"
            fi
          done
