name: Build DanteStreamer Desktop Apps

on:
  push:
    paths:
      - 'dantestreamer-desktop/**'
      - '.github/workflows/build-desktop.yml'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore dantestreamer-desktop/windows/DanteStreamerController.csproj

      - name: Build Windows app
        run: dotnet publish dantestreamer-desktop/windows/DanteStreamerController.csproj -c Release -o dantestreamer-desktop/windows/publish

      - name: Create installer (MSI)
        run: |
          cd dantestreamer-desktop/windows/publish
          7z a -tzip DanteStreamerController-win-x64.zip DanteStreamerController.exe *.dll *.pdb

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: DanteStreamerController-Windows
          path: dantestreamer-desktop/windows/publish/DanteStreamerController-win-x64.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build macOS app
        run: |
          cd dantestreamer-desktop/macos
          swift build -c release
          mkdir -p build/DanteStreamerController.app/Contents/{MacOS,Resources}
          cp .build/release/DanteStreamerController build/DanteStreamerController.app/Contents/MacOS/

      - name: Create macOS app bundle info
        run: |
          cat > dantestreamer-desktop/macos/build/DanteStreamerController.app/Contents/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>DanteStreamerController</string>
            <key>CFBundleIdentifier</key>
            <string>com.dantestreamer.controller</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>DanteStreamer Controller</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>NSHumanReadableCopyright</key>
            <string>GPLv3 - DanteStreamer Project</string>
          </dict>
          </plist>
          EOF

      - name: Create DMG
        run: |
          cd dantestreamer-desktop/macos
          hdiutil create -volname "DanteStreamer Controller" -srcfolder build -ov -format UDZO DanteStreamerController-mac.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: DanteStreamerController-macOS
          path: dantestreamer-desktop/macos/DanteStreamerController-mac.dmg

  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/DanteStreamerController-Windows/*
            artifacts/DanteStreamerController-macOS/*
          tag_name: desktop-v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          body: |
            ## DanteStreamer Desktop v1.0

            Native control applications for macOS and Windows.

            ### macOS
            - `DanteStreamerController-mac.dmg` – Double-click to install
            - Requires macOS 12.0 or later

            ### Windows
            - `DanteStreamerController-win-x64.zip` – Extract and run `DanteStreamerController.exe`
            - Requires Windows 10 or later with .NET 8 Runtime
            - Download .NET 8 Runtime: https://dotnet.microsoft.com/en-us/download/dotnet/8.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
