name: Build DanteStreamer Desktop Apps

on:
  push:
    paths:
      - 'dantestreamer-desktop/**'
      - '.github/workflows/build-desktop.yml'
    branches:
      - main
  workflow_dispatch:

# Virgil (DanteStreamer's Dante engine, GPLv3) ships inside both apps.
# Update all three together.
env:
  VIRGIL_VERSION: v0.8.1
  VIRGIL_COMMIT: 00703836a7c9b9644d1b5bf6f4496a43539fdfe5
  VIRGIL_WIN_SHA256: 4c9f347d14767300a2da9d9e4aa0b68637f888931f20e1a1edb6c9d7e6dd786f

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Virgil's official installer goes inside the exe (Install Virgil button).
      # Pinned version, checked against the SHA-256 GitHub lists for the asset.
      - name: Bundle Virgil installer
        shell: pwsh
        run: |
          $dir = "dantestreamer-desktop/windows/Virgil"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest "https://github.com/Audbol/Virgil-Virtual-Soundcard/releases/download/${{ env.VIRGIL_VERSION }}/Virgil-$("${{ env.VIRGIL_VERSION }}".TrimStart('v'))-win64-setup.exe" -OutFile "$dir/Virgil-setup.exe"
          $hash = (Get-FileHash "$dir/Virgil-setup.exe" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "${{ env.VIRGIL_WIN_SHA256 }}") { throw "Virgil installer checksum mismatch: $hash" }

      - name: Build Windows EXE (self-contained)
        working-directory: dantestreamer-desktop/windows
        run: |
          dotnet publish DanteStreamerController.csproj -c Release -r win-x64 --self-contained=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none --output publish

      - name: Create archive
        shell: pwsh
        working-directory: dantestreamer-desktop/windows/publish
        run: |
          Compress-Archive -Path DanteStreamerController.exe -DestinationPath ../DanteStreamerController-windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dantestreamer-desktop/windows/DanteStreamerController-windows.zip

  build-macos:
    runs-on: macos-latest
    outputs:
      notarized: ${{ steps.notarize.outputs.notarized }}
    steps:
      - uses: actions/checkout@v4

      # Universal binary (Apple silicon and Intel). Compiler errors are
      # repeated as annotations, so they show on the run page without logs.
      - name: Build Swift binary
        working-directory: dantestreamer-desktop/macos
        run: |
          set +e
          swift build -c release --arch arm64 --arch x86_64 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          grep -E ': (error|warning): ' build.log | sort -u | head -40 | \
            sed -E "s#^$GITHUB_WORKSPACE/##; s#^([^:]+):([0-9]+):([0-9]+): (error|warning): (.*)\$#::\4 file=\1,line=\2,col=\3::\5#"
          exit $status

      - name: Import Developer ID Certificate
        env:
          CERT_BASE64: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          echo "$CERT_BASE64" | base64 -d > cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "" build.keychain
          rm cert.p12

      # Build Virgil from source at a pinned commit and sign its engine, Core Audio
      # driver and Virgil Control with the same Developer ID, so the package inside
      # the app passes notarization with it. The app installs it with
      # /usr/sbin/installer, so the .pkg itself needs no Installer certificate;
      # it is signed too when the .p12 also holds a "Developer ID Installer" identity.
      - name: Build Virgil (signed)
        env:
          TEAM_ID: ${{ secrets.DEVELOPER_ID_TEAM }}
        run: |
          set -eEu
          # Name the failing command on the run page (job logs need a login).
          trap 'echo "::error title=Build Virgil::line $LINENO: $BASH_COMMAND (exit $?)"' ERR
          src="$RUNNER_TEMP/virgil"
          git init -q "$src"
          git -C "$src" fetch -q --depth 1 https://github.com/Audbol/Virgil-Virtual-Soundcard.git "$VIRGIL_COMMIT"
          git -C "$src" checkout -q FETCH_HEAD
          if ! command -v rustup >/dev/null; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

          # Virgil Control reads audio interface inputs; under the hardened runtime
          # that needs the audio-input entitlement.
          ent="$RUNNER_TEMP/virgil-control.entitlements"
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict><key>com.apple.security.device.audio-input</key><true/></dict></plist>' > "$ent"
          plutil -lint "$ent"
          python3 - "$src/packaging/macos/build-pkg.sh" "$ent" << 'PY'
          import sys
          path, ent = sys.argv[1], sys.argv[2]
          s = open(path).read()
          old = '\t\t"$root/Library/Audio/Plug-Ins/HAL/VirgilAudio.driver" "$root/Applications/Virgil Control.app"\n'
          new = ('\t\t"$root/Library/Audio/Plug-Ins/HAL/VirgilAudio.driver"\n'
                 '\tcodesign --force --options runtime --timestamp -s "$VIRGIL_CODESIGN_ID" \\\n'
                 '\t\t--entitlements "' + ent + '" "$root/Applications/Virgil Control.app"\n')
          if s.count(old) != 1:
              sys.exit("build-pkg.sh changed: update the Virgil Control signing patch")
          open(path, "w").write(s.replace(old, new))
          PY

          export VIRGIL_CODESIGN_ID="Developer ID Application: Johan Hoel ($TEAM_ID)"
          installer_id=$(security find-identity -v -p basic build.keychain | sed -n 's/.*"\(Developer ID Installer: [^"]*\)".*/\1/p' | head -1)
          if [ -n "$installer_id" ]; then export VIRGIL_INSTALLER_ID="$installer_id"; else echo "No Developer ID Installer identity: Virgil.pkg is unsigned (its contents are signed)."; fi
          (cd "$src" && sh packaging/macos/build-pkg.sh)
          cp "$src"/dist/Virgil-*-macos.pkg "$RUNNER_TEMP/Virgil.pkg"
          codesign -v --strict "$src/build-macos-release/virgild" || true
          pkgutil --check-signature "$RUNNER_TEMP/Virgil.pkg" || true

      - name: Create app structure
        working-directory: dantestreamer-desktop/macos
        run: |
          mkdir -p DanteStreamer.app/Contents/MacOS
          mkdir -p DanteStreamer.app/Contents/Resources
          cp .build/apple/Products/Release/DanteStreamerController DanteStreamer.app/Contents/MacOS/
          cp "$RUNNER_TEMP/Virgil.pkg" DanteStreamer.app/Contents/Resources/Virgil.pkg
          chmod +x DanteStreamer.app/Contents/MacOS/DanteStreamerController
          echo "APPL????" > DanteStreamer.app/Contents/PkgInfo

      - name: Create Info.plist
        working-directory: dantestreamer-desktop/macos
        run: |
          cat > DanteStreamer.app/Contents/Info.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>DanteStreamerController</string>
            <key>CFBundleIdentifier</key>
            <string>com.dantestreamer.controller</string>
            <key>CFBundleName</key>
            <string>DanteStreamer Controller</string>
            <key>CFBundleDisplayName</key>
            <string>DanteStreamer Controller</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.${{ github.run_number }}</string>
            <key>CFBundleVersion</key>
            <string>${{ github.run_number }}</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
            <key>LSApplicationCategoryType</key>
            <string>public.app-category.utilities</string>
            <key>NSPrincipalClass</key>
            <string>NSApplication</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>NSAppTransportSecurity</key>
            <dict>
              <key>NSAllowsArbitraryLoads</key>
              <true/>
            </dict>
            <key>NSLocalNetworkUsageDescription</key>
            <string>DanteStreamer Controller finds and connects to DanteStreamer on your network.</string>
            <key>NSBonjourServices</key>
            <array>
              <string>_raop._tcp</string>
            </array>
          </dict>
          </plist>
          EOF
          plutil -lint DanteStreamer.app/Contents/Info.plist

      - name: Code sign app with Developer ID
        working-directory: dantestreamer-desktop/macos
        env:
          TEAM_ID: ${{ secrets.DEVELOPER_ID_TEAM }}
        run: |
          codesign -s "Developer ID Application: Johan Hoel ($TEAM_ID)" --force --options runtime --timestamp DanteStreamer.app
          codesign -v --strict --verbose=2 DanteStreamer.app

      # Notarize with an App Store Connect API key (APPLE_API_KEY_ID,
      # APPLE_API_ISSUER_ID, APPLE_API_KEY_BASE64 = the .p8 file in base64)
      # or an Apple ID (APPLE_ID, APPLE_APP_PASSWORD = app-specific password),
      # the same secrets installers.yml uses.
      # Without either, the app stays signed but not notarized.
      - name: Notarize and staple
        id: notarize
        working-directory: dantestreamer-desktop/macos
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID || secrets.MACOS_NOTARY_TEAM_ID || secrets.DEVELOPER_ID_TEAM }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          # Accepts the common names for the same two secrets.
          APPLE_ID: ${{ secrets.APPLE_ID || secrets.MACOS_NOTARY_APPLE_ID || secrets.APPLE_ID_EMAIL || secrets.APPLE_USERNAME || secrets.NOTARIZATION_APPLE_ID || secrets.AC_USERNAME }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD || secrets.MACOS_NOTARY_PASSWORD || secrets.APPLE_APP_SPECIFIC_PASSWORD || secrets.APPLE_PASSWORD || secrets.NOTARIZATION_PASSWORD || secrets.AC_PASSWORD }}
        run: |
          # Which secrets this run can see (set/empty only, never the values).
          seen=""
          for v in TEAM_ID APPLE_ID APPLE_APP_PASSWORD API_KEY_ID API_ISSUER_ID API_KEY_BASE64; do
            if [ -n "${!v}" ]; then seen="$seen $v=set"; else seen="$seen $v=empty"; fi
          done
          echo "::notice title=Apple secrets::$seen"
          if [ -n "$API_KEY_ID" ] && [ -n "$API_ISSUER_ID" ] && [ -n "$API_KEY_BASE64" ]; then
            echo "$API_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
            auth=(--key "$RUNNER_TEMP/AuthKey.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID")
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            auth=(--apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$TEAM_ID")
          else
            echo "::error::Notarization secrets required (APPLE_API_KEY_ID + APPLE_API_ISSUER_ID + APPLE_API_KEY_BASE64, or APPLE_ID + APPLE_APP_PASSWORD)"
            exit 1
          fi
          ditto -c -k --keepParent DanteStreamer.app notarize.zip
          xcrun notarytool submit notarize.zip "${auth[@]}" --wait --timeout 30m --output-format json | tee notarize.json
          id=$(plutil -extract id raw notarize.json)
          if [ "$(plutil -extract status raw notarize.json)" != "Accepted" ]; then
            xcrun notarytool log "$id" "${auth[@]}" || true
            echo "::error::Notarization was not accepted"
            exit 1
          fi
          xcrun stapler staple DanteStreamer.app
          spctl --assess --type execute --verbose DanteStreamer.app
          echo "notarized=1" >> "$GITHUB_OUTPUT"

      - name: Create archive
        working-directory: dantestreamer-desktop/macos
        run: ditto -c -k --keepParent DanteStreamer.app DanteStreamer-macos.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dantestreamer-desktop/macos/DanteStreamer-macos.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Publish the macOS build even when the Windows job fails.
    if: always() && needs.build-macos.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloads

      - name: Prepare release files
        run: |
          mkdir -p release
          find downloads -type f -name "*.zip" -exec cp {} release/ \;
          ls -lah release/

      - name: List release files
        run: ls -lah release/ || echo "No release folder"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          tag_name: desktop-v1.0.${{ github.run_number }}
          draft: false
          prerelease: true
          body: |
            ## DanteStreamer Desktop v1.0

            ### macOS
            Extract the ZIP and open `DanteStreamer.app`. Requires macOS 12 or later,
            on Apple silicon or Intel. ${{ needs.build-macos.outputs.notarized == '1' && 'Signed with a Developer ID and notarized by Apple.' || 'Signed but not notarized: the first time, right-click it and choose Open.' }}

            ### Windows
            Extract the ZIP and run `DanteStreamerController.exe`. Requires Windows 10 or later.
            The .NET runtime is included.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
