name: Build DanteStreamer Desktop Apps

on:
  push:
    paths:
      - 'dantestreamer-desktop/**'
      - '.github/workflows/build-desktop.yml'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows app (self-contained)
        working-directory: dantestreamer-desktop/windows
        run: dotnet publish DanteStreamerController.csproj -c Release -o publish -r win-x64 --self-contained=true

      - name: Create ZIP archive
        working-directory: dantestreamer-desktop/windows
        run: powershell -Command "Compress-Archive -Path publish/* -DestinationPath DanteStreamerController-win-x64.zip -Force"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dantestreamer-desktop/windows/DanteStreamerController-win-x64.zip
          retention-days: 7

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Swift release binary
        working-directory: dantestreamer-desktop/macos
        run: swift build -c release -Xswiftc -suppress-warnings

      - name: Create macOS app bundle
        working-directory: dantestreamer-desktop/macos
        run: |
          BINARY=.build/release/DanteStreamerController
          APP=DanteStreamerController.app
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"
          cp "$BINARY" "$APP/Contents/MacOS/"
          chmod +x "$APP/Contents/MacOS/DanteStreamerController"

      - name: Add Info.plist
        working-directory: dantestreamer-desktop/macos
        run: |
          cat > DanteStreamerController.app/Contents/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>DanteStreamerController</string>
            <key>CFBundleIdentifier</key>
            <string>com.dantestreamer.controller</string>
            <key>CFBundleName</key>
            <string>DanteStreamer Controller</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleVersion</key>
            <string>1.0.0</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Create DMG
        working-directory: dantestreamer-desktop/macos
        run: hdiutil create -volname "DanteStreamer Controller" -srcfolder DanteStreamerController.app -ov -format UDZO DanteStreamerController-mac.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dantestreamer-desktop/macos/DanteStreamerController-mac.dmg
          retention-days: 7

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: ./release

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: ./release

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          tag_name: desktop-v1.0.${{ github.run_number }}
          draft: false
          prerelease: true
          body: |
            ## DanteStreamer Desktop v1.0

            Native control applications for macOS and Windows.

            ### macOS
            - `DanteStreamerController-mac.dmg` – Double-click to install
            - Requires macOS 12.0 or later

            ### Windows
            - `DanteStreamerController-win-x64.zip` – Extract and run
            - Requires Windows 10 or later (.NET 8 included)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
