# Quick checks for the parts without a test suite: the installers parse, and Home Deck compiles and its
# settings template validates (the same check build_kit.sh runs). Home Deck's page test (panels/tests/smoke.py)
# needs a running Home Deck and Home Assistant, so it runs on the developer's machine (panels/tools/check.sh).
name: checks
on:
  push:
    paths: ["installers/**", "panels/**", ".github/workflows/checks.yml"]
  pull_request:
    paths: ["installers/**", "panels/**", ".github/workflows/checks.yml"]
  workflow_dispatch:
jobs:
  installers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts parse
        run: |
          for f in installers/linux/setup.sh installers/macos/build.sh installers/macos/install.command; do
            bash -n "$f" && echo "ok $f"
          done
      - name: shellcheck (errors only)
        run: shellcheck --severity=error installers/linux/setup.sh installers/macos/build.sh installers/macos/install.command
      - name: The Windows installer parses
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/installers/windows/Install.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { "line $($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          'ok installers/windows/Install.ps1'

  homedeck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python compiles
        run: python -m compileall -q panels/server panels/friend panels/onboard panels/tools panels/tests
      - name: The settings template validates
        working-directory: panels/friend/src
        run: |
          sed 's#__HA_URL__#http://127.0.0.1:8123#' homedeck.toml > /tmp/hd-check.toml
          HOMEDECK_ROOT="$PWD" HOMEDECK_CONFIG=/tmp/hd-check.toml STATE_DIRECTORY="$(mktemp -d)" HOMEDECK_READONLY=1 \
            python -m homedeck.check
