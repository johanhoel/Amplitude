# Builds the Windows (.exe) and Mac (.dmg) installers for CamWatch, Home Deck and DStreamer.
# It runs on every change to installers/ (the files are then under the run's Artifacts), by hand
# (Actions -> installers -> Run workflow), and on a tag like installers-v1, which also publishes a release.
# macOS and Linux only. DStreamer needs the host's network for the PTP clock, which Windows
# does not give it, and the other two gained nothing from a Windows path nobody could support.
# The Mac files are signed and notarized when the MACOS_* and APPLE_* secrets exist (see installers/README.md).
name: installers

on:
  workflow_dispatch:
  push:
    tags: ["installers-v*"]
    branches: [main]
    paths: ["installers/**", ".github/workflows/installers.yml"]

permissions:
  contents: write

jobs:

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the .dmg files
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash installers/macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/installers-v')
    needs: [macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Installers ${{ github.ref_name }}
          body: |
            Mac: open <Project>.dmg and drag the app to Applications.
            Linux and Raspberry Pi: installers/linux. That is the way to run DStreamer - it needs the
            host's network for the PTP clock, which a Mac VM and Windows both sit behind.
            How it works and what to expect: installers/README.md in the repository.
          files: dist/*
