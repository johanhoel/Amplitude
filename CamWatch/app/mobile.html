<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#101418">
<meta name="apple-mobile-web-app-title" content="camwatch">

<link rel="icon" type="image/svg+xml" href="/static/mark.svg"><link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png"><link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<script>if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('/sw.js').catch(() => {});</script>
<title>camwatch</title>
<style>
/* Phone home screen (/m): what needs attention, live cameras, today, recent visits. Data from /api/status and /api/visits. */
:root { --bg: #101418; --ink: #eef2f6; --mute: #8b98a8; --faint: #5d6b7b; --line: #2a333d; --card: #1a2027; --card-hi: #222a33;
  --accent: #38bdf8; --ok: #22c55e; --warn: #f59e0b; --bad: #ef4444;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Inter, Roboto, sans-serif;
  --tab: calc(64px + env(safe-area-inset-bottom)); }
* { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 var(--font); -webkit-tap-highlight-color: transparent;
  padding: 0 0 calc(var(--tab) + 16px); overscroll-behavior-y: contain; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 calc(env(safe-area-inset-right) + 14px) 0 calc(env(safe-area-inset-left) + 14px); }

/* top bar */
.top { position: sticky; top: 0; z-index: 10; background: rgba(16,20,24,.94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  padding-top: env(safe-area-inset-top); border-bottom: 1px solid transparent; transition: border-color .2s; }
.top.scrolled { border-color: var(--line); }
.top .wrap { display: flex; align-items: center; gap: 10px; min-height: 58px; }
.top h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.01em; flex: 1; }
.top h1 small { display: block; font-size: 12.5px; font-weight: 600; color: var(--mute); letter-spacing: 0; }
.arm { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; font-weight: 750; font-size: 15px;
  border: 1.5px solid var(--line); background: var(--card);
  transition: border-color .15s var(--ease-out), color .15s var(--ease-out), background-color .15s var(--ease-out); }
.arm.on { border-color: var(--accent); color: var(--accent); background: rgba(56,189,248,.1); }
.arm.off { color: var(--mute); }
.arm:active { transform: scale(.96); }

.cap { display: flex; align-items: baseline; justify-content: space-between; margin: 22px 2px 10px; font-size: 13px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--mute); font-weight: 750; }
.cap a { letter-spacing: 0; text-transform: none; color: var(--accent); font-weight: 650; font-size: 14px; }

/* needs attention */
.alerts { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin-top: 12px; }
.alert { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line);
  border-left: 4px solid var(--warn); min-height: 60px; }
.alert.bad { border-left-color: var(--bad); } .alert.info { border-left-color: var(--accent); }
.alert i { font-style: normal; font-size: 22px; flex: none; width: 28px; text-align: center; }
.alert div { flex: 1; min-width: 0; } .alert b { display: block; font-size: 15px; }
.alert span { display: block; color: var(--mute); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.alert .act { flex: none; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); font-size: 13.5px; font-weight: 700; }
.allok { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; background: rgba(34,197,94,.08);
  border: 1px solid rgba(34,197,94,.3); color: #86efac; font-weight: 650; font-size: 15px; margin-top: 12px; }

/* live cameras: swipe */
.cams { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin: 0 -14px; padding: 0 14px; }
.cams::-webkit-scrollbar { display: none; }
.cam { position: relative; flex: 0 0 86%; scroll-snap-align: center; border-radius: 20px; overflow: hidden; background: #000;
  border: 1px solid var(--line); aspect-ratio: 16/9; }
.cams.single .cam { flex-basis: 100%; }
.cam img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cam .name { position: absolute; left: 10px; bottom: 10px; display: flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px;
  background: rgba(0,0,0,.62); font-weight: 750; font-size: 14px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px rgba(34,197,94,.25); }
.dot.offline { background: var(--faint); box-shadow: none; }
.cam .snooze { position: absolute; right: 8px; top: 8px; min-height: 36px; padding: 0 12px; border-radius: 999px; background: rgba(0,0,0,.62);
  font-size: 13px; font-weight: 700; }
.cam .zz { position: absolute; right: 8px; top: 8px; padding: 5px 11px; border-radius: 999px; background: rgba(245,158,11,.9); color: #1a1205; font-size: 13px; font-weight: 800; }
.dots { display: flex; justify-content: center; gap: 6px; margin-top: 8px; } .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); }

/* today */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; }
.stat b { display: block; font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { color: var(--mute); font-size: 12.5px; }
.people { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 10px -14px 0; padding: 0 14px; }
.people::-webkit-scrollbar { display: none; }
.person { flex: none; display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 5px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); }
.person i { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: 14px;
  background: rgba(34,197,94,.15); color: #86efac; }
.person b { font-size: 14px; } .person span { color: var(--mute); font-size: 12.5px; }

/* recent visits */
.list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.visit { display: flex; gap: 12px; align-items: center; padding: 8px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); min-height: 76px; }
.visit:active { background: var(--card-hi); }
.visit img { flex: none; width: 104px; aspect-ratio: 16/9; object-fit: cover; border-radius: 10px; background: #0b0e12; }
.visit .m { flex: 1; min-width: 0; }
.visit .who { font-weight: 700; font-size: 15.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.visit .who.known { color: #86efac; }
.visit .sub { color: var(--mute); font-size: 13px; display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.visit .t { flex: none; align-self: flex-start; font-weight: 750; font-variant-numeric: tabular-nums; font-size: 14px; padding-top: 2px; }
.tag { font-size: 11.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; }
.tag.u { color: var(--warn); } .tag.s { color: #f5b301; } .tag.l { color: var(--accent); }
.day { margin: 14px 2px 6px; color: var(--mute); font-size: 13px; font-weight: 700; }
.empty { color: var(--mute); text-align: center; padding: 30px 10px; }
.skel { background: linear-gradient(90deg, var(--card) 25%, var(--card-hi) 50%, var(--card) 75%); background-size: 200% 100%; animation: sk 1.2s infinite; border-radius: 16px; height: 76px; }
@keyframes sk { to { background-position: -200% 0; } }

/* bottom tabs */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; height: var(--tab); padding-bottom: env(safe-area-inset-bottom);
  background: rgba(16,20,24,.96); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr); }
nav.tabs a { display: grid; place-items: center; align-content: center; gap: 2px; font-size: 11px; font-weight: 650; color: var(--mute); }
nav.tabs a i { font-style: normal; font-size: 22px; line-height: 1; }
nav.tabs a.on { color: var(--accent); }
.toast { position: fixed; left: 50%; bottom: calc(var(--tab) + 14px); transform: translateX(-50%); background: var(--card-hi); border: 1px solid var(--line);
  padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 650; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30; }
.toast.show { opacity: 1; }
/* Reduced motion removes movement, not the opacity and colour changes that explain a state change. */
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important;
      transition-property: opacity, color, background-color, border-color, fill, stroke !important;
      transition-duration: .15s !important; }
}
</style>
<link rel="stylesheet" href="/static/splash.css">
</head>
<body>
<div class="cw-splash" id="cwSplash" hidden>
  <svg class="cw-mark is-splash" viewBox="0 0 128 128" width="96" height="96" role="img" aria-label="camwatch">
    <g fill="none" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path class="cw-b cw-b1" d="M20 40 L20 20 L40 20"/><path class="cw-b cw-b2" d="M88 20 L108 20 L108 40"/>
      <path class="cw-b cw-b3" d="M108 88 L108 108 L88 108"/><path class="cw-b cw-b4" d="M40 108 L20 108 L20 88"/>
    </g>
    <circle class="cw-ring" cx="64" cy="64" r="21" fill="none" stroke="#38bdf8" stroke-width="8"/>
    <circle class="cw-rec" cx="64" cy="64" r="7.5" fill="#ef4444"/>
  </svg>
  <div class="cw-word">camwatch</div>
</div>
<script>
// A splash earns its place on an app launch, not on every page view. Standalone only, once per session.
(function () {
  var el = document.getElementById('cwSplash');
  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  var seen; try { seen = sessionStorage.getItem('cw-splash'); } catch (e) { seen = null; }
  if (!standalone || seen) { el.remove(); return; }
  try { sessionStorage.setItem('cw-splash', '1'); } catch (e) {}
  el.hidden = false;
  setTimeout(function () {
    el.classList.add('is-done');
    el.addEventListener('transitionend', function () { el.remove(); }, { once: true });
  }, 1100);
})();
</script>
<div class="top" id="top"><div class="wrap">
  <h1><img src="/static/mark.svg" alt="" width="27" height="27" style="vertical-align:-5px;margin-right:7px">camwatch<small id="sub">loading…</small></h1>
  <button class="arm" id="arm" onclick="toggleArm()" aria-label="Arm or disarm">…</button>
</div></div>

<main class="wrap">
  <div id="attention"></div>

  <div id="camsec" hidden>
    <div class="cap"><span>Cameras</span><a href="/view">Wall view →</a></div>
    <div class="cams" id="cams"></div>
    <div class="dots" id="dots"></div>
  </div>

  <div class="cap"><span>Today</span><a href="/report">Report →</a></div>
  <div class="stats">
    <div class="stat"><b id="n-today">–</b><span>visits today</span></div>
    <div class="stat"><b id="n-people">–</b><span>people seen</span></div>
    <div class="stat"><b id="n-week">–</b><span>this week</span></div>
  </div>
  <div class="people" id="people"></div>

  <div class="cap"><span>Recent</span><a href="/">All clips →</a></div>
  <div class="list" id="recent"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  <p id="ver" style="text-align:center;color:var(--faint);font-size:12px;margin:22px 0 4px"></p>
</main>

<nav class="tabs" aria-label="Pages">
  <a href="/m" class="on"><i>🏠</i>Home</a>
  <a href="/live"><i>📹</i>Live</a>
  <a href="/"><i>🎞️</i>Clips</a>
  <a href="/search"><i>🔍</i>Search</a>
  <a href="/settings"><i>⚙️</i>Settings</a>
</nav>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'})[c]);
const hm = iso => iso ? iso.slice(11, 16) : '';
const day = d => d.toISOString().slice(0, 10);
async function get(url) { const r = await fetch(url, {cache: 'no-store'}); if (!r.ok) throw new Error(r.status); return r.json(); }
async function post(url, data) {
  const body = new URLSearchParams(data || {});
  const r = await fetch(url, {method: 'POST', body, redirect: 'manual'});
  return r.ok || r.type === 'opaqueredirect' || (r.status >= 300 && r.status < 400);
}
function toast(text) { const t = $('toast'); t.textContent = text; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200); }
function who(v) {
  if (v.people.length) return v.people.map(p => p.name).join(', ');
  if (v.unknown) return v.unknown > 1 ? `${v.unknown} unknown people` : 'Unknown person';
  if (v.plates && v.plates.length) return v.plates.map(p => p.name || p.plate).join(', ');
  const l = v.labels[0]; return l ? l[0].toUpperCase() + l.slice(1) : 'Motion';
}

let status = null, cams = [];
async function loadStatus() {
  try { status = await get('/api/status'); } catch { $('sub').textContent = 'not reachable'; return; }
  if (status.version) $('ver').textContent = `camwatch ${status.version.text}`;
  const s = status;
  $('arm').className = 'arm ' + (s.armed ? 'on' : 'off');
  $('arm').innerHTML = s.armed ? '🛡️ Armed' : '🔕 Disarmed';
  $('sub').textContent = s.mode === 'schedule' ? `schedule ${s.schedule}` : (s.armed ? 'pushes on' : 'recording, no pushes');
  $('n-today').textContent = s.today; $('n-week').textContent = s.week; $('n-people').textContent = s.people_today.length;
  $('people').innerHTML = s.people_today.map(p => `<a class="person" href="/?person=${encodeURIComponent(p.name)}"><i>${esc(p.name[0])}</i><b>${esc(p.name)}</b><span>${hm(p.last)}</span></a>`).join('');
  attention(s);
  cameras(s.cameras, s.snoozed || {});
}

function attention(s) {
  const items = [];
  s.cameras.filter(c => !c.online).forEach(c => items.push({cls: 'bad', icon: '📵', title: `${c.name} is offline`, text: 'no picture from the camera', href: `/live?camera=${encodeURIComponent(c.name)}`}));
  (s.unusual_today || []).slice(-3).reverse().forEach(u => items.push({icon: '⚠️', title: `Unusual: ${u.camera} at ${hm(u.start)}`, text: u.reason, href: `/clip/${u.day}/${encodeURIComponent(u.stem)}`}));
  (s.packages_waiting || []).forEach(p => items.push({cls: 'info', icon: '📦', title: `Package at ${p.zone}`, text: `delivered ${hm(p.at)}`, href: p.clip ? `/clip/${p.clip}` : '/'}));
  if (s.strangers) items.push({cls: 'info', icon: '👤', title: `${s.strangers} recurring stranger${s.strangers > 1 ? 's' : ''}`, text: 'name them once, recognised from then on', href: '/strangers'});
  if (s.offsite && s.offsite.enabled && s.offsite.error) items.push({cls: 'bad', icon: '☁️', title: 'Off-site uploads failing', text: s.offsite.error, href: '/settings#offsite'});
  Object.entries(s.snoozed || {}).forEach(([cam, until]) => items.push({icon: '😴', title: `${cam} snoozed until ${until}`, text: 'no pushes from this camera',
    act: {label: 'Resume', run: () => snooze(cam, 0)}}));
  const box = $('attention');
  if (!items.length) { box.innerHTML = `<div class="allok">✓ All quiet - ${s.cameras.length} camera${s.cameras.length > 1 ? 's' : ''} online</div>`; return; }
  box.innerHTML = `<div class="alerts">${items.map((a, i) => `<${a.href ? `a href="${a.href}"` : 'div'} class="alert ${a.cls || ''}"><i>${a.icon}</i>
    <div><b>${esc(a.title)}</b><span>${esc(a.text)}</span></div>${a.act ? `<button class="act" data-i="${i}">${a.act.label}</button>` : ''}</${a.href ? 'a' : 'div'}>`).join('')}</div>`;
  box.querySelectorAll('.act').forEach(b => b.onclick = e => { e.preventDefault(); items[+b.dataset.i].act.run(); });
}

function cameras(list, snoozed) {
  $('camsec').hidden = !list.length;
  if (JSON.stringify(list.map(c => [c.name, c.online, snoozed[c.name]])) !== JSON.stringify(cams.map(c => [c.name, c.online, c.zz]))) {
    cams = list.map(c => ({...c, zz: snoozed[c.name]}));
    $('cams').className = 'cams' + (cams.length === 1 ? ' single' : '');
    $('cams').innerHTML = cams.map(c => `<a class="cam" href="/live?camera=${encodeURIComponent(c.name)}" data-cam="${esc(c.name)}"><img alt="${esc(c.name)} live">
      <span class="name"><span class="dot ${c.online ? '' : 'offline'}"></span>${esc(c.name)}</span>
      ${c.zz ? `<span class="zz">😴 until ${esc(c.zz)}</span>` : `<button class="snooze" data-cam="${esc(c.name)}" aria-label="Snooze ${esc(c.name)} for one hour">😴 1h</button>`}</a>`).join('');
    $('dots').innerHTML = cams.length > 1 ? cams.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('') : '';
    $('cams').querySelectorAll('.snooze').forEach(b => b.onclick = e => { e.preventDefault(); snooze(b.dataset.cam, 60); });
    refreshPictures(true);
  }
}
let visibleCam = 0;
$('cams').addEventListener('scroll', () => {
  const el = $('cams'), i = Math.round(el.scrollLeft / (el.firstElementChild ? el.firstElementChild.offsetWidth + 10 : 1));
  if (i !== visibleCam) { visibleCam = i; document.querySelectorAll('#dots i').forEach((d, j) => d.classList.toggle('on', j === i)); refreshPictures(); }
}, {passive: true});
function refreshPictures(all) {   // only the camera in view is refreshed (saves the phone's data and the server's work)
  if (document.visibilityState !== 'visible') return;
  document.querySelectorAll('#cams .cam').forEach((el, i) => {
    if (!all && i !== visibleCam) return;
    const img = el.querySelector('img'), next = new Image();
    next.onload = () => { img.src = next.src; };
    next.src = `/live.jpg?camera=${encodeURIComponent(el.dataset.cam)}&w=640&t=${Date.now()}`;
  });
}

async function loadRecent() {
  const today = new Date(), yesterday = new Date(Date.now() - 864e5);
  let groups = [];
  try {
    const [a, b] = await Promise.all([get(`/api/visits?day=${day(today)}`), get(`/api/visits?day=${day(yesterday)}`).catch(() => [])]);
    groups = [['Today', a], ['Yesterday', b]].filter(g => g[1].length);
  } catch { $('recent').innerHTML = '<div class="empty">Could not load the visits.</div>'; return; }
  let left = 20;
  const html = groups.map(([label, vs]) => {
    const items = vs.slice(0, left); left -= items.length;
    if (!items.length) return '';
    return `<div class="day">${label}</div>` + items.map(v => {
      const tags = [v.star ? '<span class="tag s">★</span>' : '', v.unusual ? '<span class="tag u">⚠ unusual</span>' : '',
        v.visit && v.visit.length ? `<span class="tag l">🔗 ${esc([...new Set(v.visit)].join(', '))}</span>` : ''].join('');
      return `<a class="visit" href="/clip/${v.day}/${encodeURIComponent(v.stem)}"><img loading="lazy" alt="" src="/api/thumb/${v.day}/${encodeURIComponent(v.stem)}.jpg?w=240">
        <div class="m"><div class="who ${v.people.length ? 'known' : ''}">${esc(who(v))}</div><div class="sub"><span>${esc(v.camera)}</span>${tags}</div></div>
        <span class="t">${hm(v.start)}</span></a>`;
    }).join('');
  }).join('');
  $('recent').innerHTML = html || '<div class="empty">Nothing recorded today or yesterday.</div>';
}

async function toggleArm() {
  if (!status) return;
  const was = status.armed;
  $('arm').disabled = true;
  if (await post('/arm')) { toast(was ? 'Disarmed - recording continues, no pushes' : 'Armed - pushes on'); if (navigator.vibrate) navigator.vibrate(20); }
  else toast('Could not change it');
  $('arm').disabled = false;
  loadStatus();
}
async function snooze(cam, minutes) {
  if (await post('/snooze', {camera: cam, minutes})) toast(minutes ? `${cam}: no pushes for 1 hour` : `${cam}: pushes on again`);
  cams = []; loadStatus();
}

window.addEventListener('scroll', () => $('top').classList.toggle('scrolled', scrollY > 4), {passive: true});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { loadStatus(); loadRecent(); } });
loadStatus(); loadRecent();
setInterval(loadStatus, 30000); setInterval(loadRecent, 60000); setInterval(() => refreshPictures(), 5000);
</script>
</body>
</html>
