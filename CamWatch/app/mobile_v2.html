<head>

<title>camwatch</title>
<style>
:root { --bg:#0f172a;--card:#1e293b;--card-hi:#253348;--ink:#e2e8f0;--mute:#94a3b8;--line:#334155;--accent:#38bdf8;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--r:8px }
*{box-sizing:border-box;margin:0;padding:0}html,body{background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.topbar{position:sticky;top:0;z-index:10;background:rgba(15,23,42,.95);backdrop-filter:blur(12px);padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line)}.topbar-inner{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:56px;padding:0 14px}.topbar h1{font-size:20px;font-weight:800;letter-spacing:-.01em;flex:1;display:flex;align-items:center;gap:8px}.topbar h1 img{width:26px;height:26px}.topbar small{display:block;font-size:11.5px;font-weight:600;color:var(--mute);letter-spacing:0;margin-top:-2px}
.arm-btn{min-height:40px;padding:0 14px;border-radius:999px;font-weight:750;font-size:13.5px;border:1.5px solid var(--line);background:var(--card);transition:all .15s}.arm-btn.on{border-color:var(--accent);color:var(--accent);background:rgba(56,189,248,.1)}.arm-btn.off{color:var(--mute)}
.main{max-width:600px;margin:0 auto;padding:0 14px calc(var(--tab,56px)+16px)}
.attention-title{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:750;margin:18px 0 8px}
.alert-card{display:flex;gap:10px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:var(--r);margin-bottom:6px}.alert-card.bad{border-left-color:var(--bad)}.alert-card.info{border-left-color:var(--accent)}
.alert-icon{font-size:20px;flex:none;width:24px;text-align:center}
.alert-body{flex:1;min-width:0}.alert-body b{display:block;font-size:14.5px;font-weight:700}.alert-body span{display:block;color:var(--mute);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.alert-action{flex:none;min-height:34px;padding:0 10px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:700;white-space:nowrap}
.all-ok{display:flex;align-items:center;gap:8px;padding:12px 14px;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.25);color:#86efac;font-weight:650;font-size:14.5px;border-radius:var(--r);margin-top:8px}
.cam-strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -14px;padding:0 14px}.cam-strip::-webkit-scrollbar{display:none}.cam-strip.single .cam-tile{flex-basis:100%}
.cam-tile{position:relative;flex:0 0 85%;scroll-snap-align:center;border-radius:var(--r);overflow:hidden;background:#000;border:1px solid var(--line);aspect-ratio:16/9}.cam-tile img{width:100%;height:100%;object-fit:cover;display:block}
.cam-name{position:absolute;left:8px;bottom:8px;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.65);font-weight:750;font-size:13px;display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2.5px rgba(34,197,94,.2)}.dot.offline{background:var(--mute);box-shadow:none}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px}.stat-box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;text-align:center}.stat-box b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}.stat-box span{color:var(--mute);font-size:11.5px}
.visit-card{display:flex;gap:10px;padding:8px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);margin-bottom:4px;min-height:72px}.visit-thumb{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:calc(var(--r)-2px);background:#0b0e12;flex:none}
.visit-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}.visit-who{font-weight:750;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.visit-who.known{color:#86efac}.visit-meta{color:var(--mute);font-size:12px;display:flex;gap:5px;margin-top:1px;flex-wrap:wrap}
.visit-time{align-self:flex-start;font-weight:700;font-size:13.5px;padding-top:4px;color:var(--mute)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;height:56px;padding-bottom:env(safe-area-inset-bottom);background:rgba(15,23,42,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr)}.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:650;color:var(--mute);text-decoration:none}.tabs a.on{color:var(--accent)}.tabs i{font-style:normal;font-size:20px;line-height:1}
.toast{position:fixed;left:50%;bottom:calc(56px+14px);transform:translateX(-50%);background:var(--card-hi);border:1px solid var(--line);padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:650;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}.toast.show{opacity:1}
.skel{background:linear-gradient(90deg,var(--card) 25%,var(--card-hi) 50%,var(--card) 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:var(--r);height:68px}@keyframes sk{to{background-position:-200% 0}}
.splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .4s}.splash.hide{opacity:0;pointer-events:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.15s!important}}
</style>
<link rel="stylesheet" href="/static/icons.css">
</head>
<body>
<div class="splash" id="splash"><svg viewBox="0 0 128 128" width="96" height="96" role="img" aria-label="camwatch"><g fill="none" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 40 L20 20 L40 20"/><path d="M88 20 L108 20 L108 40"/><path d="M108 88 L108 108 L88 108"/><path d="M40 108 L20 108 L20 88"/></g><circle cx="64" cy="64" r="21" fill="none" stroke="#38bdf8" stroke-width="8"/><circle cx="64" cy="64" r="7.5" fill="#ef4444"/></svg></div>
<div class="topbar"><div class="topbar-inner"><h1><img src="/static/mark.svg" alt="" width="26" height="26" style="vertical-align:-5px;margin-right:6px">camwatch<small id="sub">loading...</small></h1><button class="arm-btn" id="armBtn" onclick="toggleArm()" aria-label="Arm or disarm">...</button></div></div>
<div class="main"><div class="attention-title">Needs attention</div><div id="attention"><div class="skel"></div><div class="skel"></div></div><div id="camsec" hidden style="margin-top:14px"><div class="attention-title">Cameras</div><div class="cam-strip" id="cams"></div></div><div class="attention-title">Today</div><div class="stats-row"><div class="stat-box"><b id="n-today">-</b><span>visits today</span></div><div class="stat-box"><b id="n-people">-</b><span>people seen</span></div><div class="stat-box"><b id="n-week">-</b><span>this week</span></div></div><div class="attention-title" style="margin-top:16px">Recent</div><div id="recent"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div><p id="ver" style="text-align:center;color:var(--mute);font-size:11.5px;margin:20px 0 4px"></p></div>
<nav class="tabs"><a href="/m" class="on"><i><i class="icon icon-home"></i></i>Home</a><a href="/live"><i><i class="icon icon-video"></i></i>Live</a><a href="/"><i><i class="icon icon-film"></i></i>Clips</a><a href="/search"><i><i class="icon icon-search"></i></i>Search</a><a href="/settings"><i><i class="icon icon-gear"></i></i>Settings</a></nav>
<div class="toast" id="toast"></div>
<script>
var $=function(id){return document.getElementById(id)};var esc=function(s){return String(s||'').replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})};var hm=function(iso){return iso?iso.slice(11,16):''};
(function(){var el=$('splash');var standalone=window.matchMedia('(display-mode:standalone)').matches||window.navigator.standalone===true;try{var seen=sessionStorage.getItem('cw-splash2')}catch(e){}if(!standalone||seen){el.classList.add('hide');return}try{sessionStorage.setItem('cw-splash2','1')}catch(e){}setTimeout(function(){el.classList.add('hide')},900)})();
function toast(text){var t=$('toast');t.textContent=text;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show')},2500)}
async function get(url){var r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(r.status);return r.json()}
async function post(url,data){var body=new URLSearchParams(data||{});var r=await fetch(url,{method:'POST',body:body,redirect:'manual'});return r.ok||(r.type==='opaqueredirect')||(r.status>=300&&r.status<400)}
var status=null,cams=[];async function loadStatus(){try{status=await get('/api/status')}catch(e){$('sub').textContent='offline';return}if(status.version)$('ver').textContent='camwatch '+(status.version.text||'');var s=status;var armBtn=$('armBtn');armBtn.className='arm-btn'+(s.armed?' on':' off');armBtn.innerHTML=s.armed?'<i class="icon icon-shield"></i> Armed':'<i class="icon icon-bell-off"></i> Disarmed';$('sub').textContent=s.mode==='schedule'?'schedule '+(s.schedule||''):(s.armed?'pushes on':'recording');var plural=function(n,one,many){return n===1?one:many};$('n-today').textContent=s.today||'0';$('n-week').textContent=s.week||'0';$('n-people').textContent=(s.people_today||[]).length;attention(s);cameras(s.cameras,s.snoozed||{})}
function attention(s){var items=[];(s.cameras||[]).filter(function(c){return!c.online}).forEach(function(c){items.push({cls:'bad',icon:'video',title:c.name+' is offline',text:'no picture from the camera',href:'/live?camera='+encodeURIComponent(c.name)})});(s.unusual_today||[]).slice(-3).reverse().forEach(function(u){items.push({icon:'alert',title:'Unusual: '+u.camera+' at '+hm(u.start),text:u.reason||'',href:'/clip/'+u.day+'/'+encodeURIComponent(u.stem)})});(s.packages_waiting||[]).forEach(function(p){items.push({cls:'info',icon:'package',title:'Package at '+p.zone,text:'delivered '+hm(p.at),href:p.clip?'/clip/'+p.clip:'/'});});if(s.strangers)items.push({cls:'info',icon:'person',title:s.strangers+(s.strangers===1?' recurring stranger':' recurring strangers'),text:'name them once, recognised from then on',href:'/strangers'});if(s.offsite&&s.offsite.enabled&&s.offsite.error)items.push({cls:'bad',icon:'cloud',title:'Off-site uploads failing',text:s.offsite.error,href:'/settings#offsite'});var box=$('attention');if(!items.length){box.innerHTML='<div class="all-ok">All quiet - '+(s.cameras?s.cameras.length:0)+' camera(s) online</div>';return}box.innerHTML=items.map(function(a,i){var tag=a.href?'a href="'+a.href+'"':'div';return '<'+tag+' class="alert-card '+(a.cls||'')+'" data-i="'+i+'"><span class="alert-icon"><i class="icon icon-'+a.icon+'"></i></span><div class="alert-body"><b>'+esc(a.title)+'</b><span>'+esc(a.text)+'</span></div>'+(a.act?'<button class="alert-action" data-i="'+i+'">'+a.act.label+'</button>':'')+'</'+(a.href?'a':'div')+'>';}).join('');box.querySelectorAll('.alert-action').forEach(function(b){b.onclick=function(e){e.preventDefault();var i=+b.dataset.i;if(items[i]&&items[i].act)items[i].act.run()}})}
function cameras(list,snoozed){$('camsec').hidden=!list||!list.length;if(!list)return;var newCams=list.map(function(c){return[c.name,c.online,snoozed[c.name]]});var oldCams=cams.map(function(c){return[c[0],c[1],c[2]]});if(JSON.stringify(newCams)!==JSON.stringify(oldCams)){cams=list.map(function(c){return Object.assign({},c,{zz:snoozed[c.name]})});var strip=$('cams');strip.className='cam-strip'+(cams.length===1?' single':'');strip.innerHTML=cams.map(function(c){var dotClass=c.online?'':' offline';return '<a class="cam-tile" href="/live?camera='+encodeURIComponent(c.name)+'" data-cam="'+esc(c.name)+'"><img alt="'+esc(c.name)+' live"><span class="cam-name"><span class="dot'+dotClass+'"></span>'+esc(c.name)+'</span>'+(c.zz?'<span style="position:absolute;right:6px;top:6px;padding:3px 8px;border-radius:999px;background:rgba(245,158,11,.9);color:#1a1205;font-size:12px;font-weight:800">until '+esc(c.zz)+'</span>':'<button class="snooze" data-cam="'+esc(c.name)+'" style="position:absolute;right:6px;top:6px;min-height:32px;padding:0 10px;border-radius:999px;background:rgba(0,0,0,.6);font-size:12px;font-weight:700">Snooze 1h</button>')+'</a>';}).join('');strip.querySelectorAll('.snooze').forEach(function(b){b.onclick=function(e){e.preventDefault();snooze(b.dataset.cam,60)}});refreshPictures(true)}}
var visibleCam=0;document.addEventListener('DOMContentLoaded',function(){var camsEl=$('cams');if(camsEl)camsEl.addEventListener('scroll',function(){var el=$('cams'),i=Math.round(el.scrollLeft/(el.firstElementChild?el.firstElementChild.offsetWidth+8:1));if(i!==visibleCam){visibleCam=i;refreshPictures()}},{passive:true})});
function refreshPictures(all){if(document.visibilityState!=='visible')return;document.querySelectorAll('#cams .cam-tile').forEach(function(el,i){if(!all&&i!==visibleCam)return;var img=el.querySelector('img'),next=new Image();next.onload=function(){img.src=next.src};next.src='/live.jpg?camera='+encodeURIComponent(el.dataset.cam)+'&w=640&t='+Date.now()})}
async function loadRecent(){var today=new Date(),yesterday=new Date(Date.now()-864e5);try{var[a,b]=await Promise.all([get('/api/visits?day='+today.toISOString().slice(0,10)),get('/api/visits?day='+yesterday.toISOString().slice(0,10)).catch(function(){return[]})]);var groups=[['Today',a.visits||[]],['Yesterday',b.visits||[]]].filter(function(g){return g[1].length});if(!groups.length){$('recent').innerHTML='<div style="color:var(--mute);text-align:center;padding:24px 8px">Nothing recorded today or yesterday.</div>';return}var html=groups.map(function(g){var label=g[0],vs=g[1].slice(0,6);if(!vs.length)return'';return '<div style="color:var(--mute);font-size:12px;font-weight:700;margin:8px 0 4px">'+label+'</div>'+vs.map(function(v){var who=v.who||'Motion';var knownClass=(v.visitors&&v.visitors.some(function(p){return p.name}))?' known':'';return '<a class="visit-card" href="/clip/'+esc(v.day)+'/'+encodeURIComponent(esc(v.stem))+'"><img loading="lazy" alt="" src="/api/thumb/'+esc(v.day)+'/'+encodeURIComponent(esc(v.stem))+'.jpg?w=240"><div class="visit-info"><div class="visit-who'+knownClass+'">'+esc(who)+'</div><div class="visit-meta"><span>'+esc(v.camera)+'</span></div></div><span class="visit-time">'+hm(v.started_at)+'</span></a>';}).join('');}).join('');$('recent').innerHTML=html}catch(e){$('recent').innerHTML='<div style="color:var(--mute);text-align:center;padding:24px 8px">Could not load visits.</div>'}}
async function toggleArm(){if(!status)return;var was=status.armed;$('armBtn').disabled=true;if(await post('/api/settings/arm')){toast(was?'Disarmed - recording continues, no pushes':'Armed - pushes on')}else{toast('Could not change it')}$('armBtn').disabled=false;loadStatus()}
async function snooze(cam,minutes){if(await post('/api/cameras/'+encodeURIComponent(cam)+'/snooze',{minutes:minutes})){toast(minutes?cam+': no pushes for 1 hour':cam+': pushes on again')}cams=[];loadStatus()}
loadStatus();loadRecent();setInterval(loadStatus,30000);setInterval(loadRecent,60000);setInterval(function(){refreshPictures()},5000);document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){loadStatus();loadRecent()}});
</script>
</body>
</html>
